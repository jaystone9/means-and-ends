<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Means &amp; Ends</title>
<meta name="description" content="Learn what socialism and communism are, where they came from, what worked and what failed.">
<meta name="theme-color" content="#FFF1E9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Means & Ends">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Means & Ends. Soft, layered, modern: big radii, gentle gradients, frosted bars, vermilion accent. */
:root{
  --bg:linear-gradient(180deg,#FFF1E9 0%,#F7F2FF 42%,#EEF3FF 100%);--bgflat:#FBF3F1;
  --card:linear-gradient(160deg,#FFFFFF 0%,#FFF8F4 100%);--solid:#FFFFFF;--line:rgba(26,21,51,.08);
  --glass:rgba(255,255,255,.75);--bar:rgba(255,250,247,.68);
  --sh:0 1px 2px rgba(26,21,51,.05),0 10px 30px -6px rgba(26,21,51,.10),0 30px 60px -20px rgba(214,58,28,.16);
  --shs:0 1px 2px rgba(26,21,51,.06),0 6px 16px -6px rgba(26,21,51,.14);
  --ink:#1A1533;--ink2:#4A4466;--ink3:#6F6890;
  --acc:#F2603A;--acct:#C2341B;--accs:rgba(242,96,58,.13);
  --btn:linear-gradient(135deg,#F46A42 0%,#D63A1C 100%);--btnsh:0 12px 26px -10px rgba(214,58,28,.7),inset 0 1px 0 rgba(255,255,255,.35);
  --halo:radial-gradient(circle,rgba(255,177,92,.45) 0%,rgba(255,177,92,0) 70%);
  --track:rgba(26,21,51,.10);--flame:#D9580A;--heart:#D81B50;
  --ok:#0E8A44;--okt:#0B6E36;--oks:rgba(14,138,68,.12);--okbtn:linear-gradient(135deg,#27B565 0%,#0E8A44 100%);
  --bad:#D0224F;--badt:#B01840;--bads:rgba(208,34,79,.10);--badbtn:linear-gradient(135deg,#F0477A 0%,#C81E46 100%);
  --teal:#0D7C6F;--teals:rgba(31,165,149,.14);--gold:#B77700;
  --sel:linear-gradient(135deg,#FFF0E8 0%,#FFE2D4 100%);--selline:#F2603A;
  --ring:rgba(255,255,255,.7);--glow:rgba(242,96,58,.45);
  --lock:radial-gradient(circle at 35% 28%,#FFFFFF 0%,#F1EEF8 60%,#DCD6EA 100%);--locksh:0 10px 20px -8px rgba(26,21,51,.28),inset 0 -5px 8px rgba(26,21,51,.08),inset 0 4px 8px rgba(255,255,255,.9);--lockink:#7C7499;
  --h1:#D7F0E2;--h2:#E9F6EF;--h3:#E6F1FB;--h4:#EFF5FC;--tree1:#8FDBA8;--tree2:#3E9C63;--trunk:#9A6E4C;
  --roof:#C9C2E6;--bldg:#FFFFFF;--bldg2:#E4E0F2;--road:#FFF9F3;--roade:#F0E3D6;--roadd:#E2C9B2;--water:#BFE3F5;--sun:#FFD68A;
  --sheet:rgba(255,253,251,.94);--bubble:#FFFFFF;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:radial-gradient(130% 70% at 50% 0%,#3B1631 0%,#1B1233 45%,#0D0A1C 100%);--bgflat:#150F28;
  --card:linear-gradient(160deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.04) 100%);--solid:#241B40;--line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.08);--bar:rgba(20,14,38,.66);
  --sh:0 1px 2px rgba(0,0,0,.3),0 18px 40px -10px rgba(0,0,0,.55),0 0 60px -20px rgba(255,106,77,.35);
  --shs:0 6px 16px -6px rgba(0,0,0,.5);
  --ink:#F6F2FF;--ink2:#C9C2E0;--ink3:#A79FC4;
  --acc:#FF7A57;--acct:#FF9677;--accs:rgba(255,122,87,.16);
  --btn:linear-gradient(135deg,#FF7550 0%,#DA3E1F 100%);--btnsh:0 0 34px -4px rgba(255,106,77,.55),inset 0 1px 0 rgba(255,255,255,.3);
  --halo:radial-gradient(circle,rgba(255,140,90,.35) 0%,rgba(255,140,90,0) 70%);
  --track:rgba(255,255,255,.14);--flame:#FF9A4A;--heart:#FF5C82;
  --ok:#3DDC84;--okt:#6BE8A2;--oks:rgba(61,220,132,.14);--okbtn:linear-gradient(135deg,#2FBF6E 0%,#12894A 100%);
  --bad:#FF5C82;--badt:#FF8FA9;--bads:rgba(255,92,130,.14);--badbtn:linear-gradient(135deg,#F0477A 0%,#C81E46 100%);
  --teal:#5FE0CC;--teals:rgba(95,224,204,.14);--gold:#FFC65C;
  --sel:linear-gradient(135deg,rgba(255,122,87,.30) 0%,rgba(255,122,87,.16) 100%);--selline:#FF7A57;
  --ring:rgba(255,255,255,.07);--glow:rgba(255,106,77,.6);
  --lock:radial-gradient(circle at 35% 28%,#4A4168 0%,#2E2747 60%,#1E1833 100%);--locksh:0 10px 20px -8px rgba(0,0,0,.6),inset 0 -5px 8px rgba(0,0,0,.3),inset 0 3px 6px rgba(255,255,255,.12);--lockink:#A79FC4;
  --h1:#1E2A40;--h2:#161C30;--h3:#241D40;--h4:#1A1530;--tree1:#3F8F6A;--tree2:#1D4D3A;--trunk:#5A4234;
  --roof:#4B3F78;--bldg:#2E2748;--bldg2:#3B3360;--road:#2A2344;--roade:#1F1A36;--roadd:#5B4F86;--water:#1F3A5C;--sun:#7A4A5E;
  --sheet:rgba(30,22,54,.94);--bubble:#2E2450;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bgflat);color:var(--ink);font:500 17px/1.5 Inter,system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;background:var(--bg);z-index:-1}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.025em;line-height:1.1;margin:0}
h1{font-weight:800;font-size:32px}h2{font-weight:800;font-size:26px}h3{font-weight:800;font-size:21px}
p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
.muted{color:var(--ink2)}.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
.mascot{display:inline-block;line-height:0;flex-shrink:0}.mascot svg{display:block;overflow:visible}
#app{max-width:480px;margin:0 auto;padding:calc(96px + env(safe-area-inset-top)) 0 calc(104px + env(safe-area-inset-bottom));min-height:100dvh;position:relative}
.page{padding:0 16px;display:flex;flex-direction:column;gap:18px}

/* bars */
.top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topin{max-width:480px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--glass);font-weight:700;font-size:16px;box-shadow:var(--shs);transition:transform .15s}
.pill:active{transform:scale(.96)}
.stats{display:flex;align-items:center;gap:14px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:18px;min-height:44px}
.stat small{font-weight:600;font-size:13px;color:var(--ink2)}
.stat.flame{color:var(--flame)}.stat.heart{color:var(--heart)}
.slim[hidden]{display:none}
.slim{align-self:center;display:flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border-radius:999px;background:var(--accs);color:var(--acct);font-weight:700;font-size:13.5px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 10px 12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-weight:700;font-size:12.5px;min-height:56px}
.tab i{display:flex;align-items:center;justify-content:center;width:60px;height:36px;border-radius:18px;transition:transform .35s cubic-bezier(.3,1.7,.5,1),background .2s}
.tab.on{color:var(--acct);font-weight:800}
.tab.on i{background:var(--btn);color:#fff;box-shadow:0 6px 14px -4px rgba(214,58,28,.55);transform:translateY(-2px)}
.tab.on i svg{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg)}100%{transform:none}}

/* cards and buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);padding:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%;padding:0 22px;border-radius:20px;background:var(--btn);color:#fff;font-weight:800;font-size:19px;box-shadow:var(--btnsh);transition:transform .15s,filter .15s,opacity .2s}
.btn:active{transform:scale(.97);filter:brightness(.94)}
.btn.sm{min-height:46px;width:auto;font-size:15.5px;border-radius:16px;padding:0 16px}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shs)}
.btn.ok{background:var(--okbtn);box-shadow:0 12px 26px -10px rgba(14,138,68,.75),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.bad{background:var(--badbtn);box-shadow:0 12px 26px -10px rgba(200,30,70,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn[disabled]{background:var(--track);color:var(--ink3);box-shadow:none;cursor:default}
.link{color:var(--acct);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--accs);color:var(--acct);font-weight:800;font-size:13.5px}
.chip.teal{background:var(--teals);color:var(--teal)}
.kicker{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--acct)}

/* home */
.today{margin:34px 16px 0;display:flex;flex-direction:column;gap:14px;position:relative}
.todayrow{display:flex;align-items:flex-end;gap:6px;min-height:132px}
.todaym{position:relative;width:146px;height:140px;flex-shrink:0;margin:-52px 0 0 -14px}
.todaym::before{content:"";position:absolute;left:6px;top:20px;width:140px;height:140px;border-radius:50%;background:var(--halo)}
.todaym .mascot{position:absolute;left:0;bottom:-14px}
.todayt{display:flex;flex-direction:column;gap:5px;padding-bottom:6px;min-width:0}
.todayt b{font:800 28px/1.06 'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.03em}
.todayt span:last-child{font-size:15px;line-height:1.35;color:var(--ink2)}
.uhead{margin:34px 16px 0;display:flex;flex-direction:column;gap:8px}
.uhead .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.uhead p{font-size:16.5px;line-height:1.45;color:var(--ink2)}
.stage{position:relative;width:100%;margin-top:10px;overflow:hidden}
.stage>svg{position:absolute;left:0;top:0;width:100%;height:100%}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s cubic-bezier(.3,1.7,.5,1);z-index:2}
.node:active{transform:scale(.92)}
.node.done{background:radial-gradient(circle at 35% 28%,#FF9A6E 0%,#EE5530 50%,#B8301A 100%);box-shadow:0 12px 22px -8px rgba(190,50,20,.6),inset 0 -6px 10px rgba(80,10,0,.25),inset 0 4px 8px rgba(255,255,255,.45)}
.node.cur{width:78px;height:78px;margin:-39px 0 0 -39px;background:radial-gradient(circle at 35% 28%,#FFA27A 0%,#F2603A 45%,#C2341B 100%);box-shadow:0 0 0 10px var(--ring),0 0 40px 8px var(--glow),0 14px 26px -8px rgba(200,55,25,.7),inset 0 -7px 12px rgba(80,10,0,.28),inset 0 5px 10px rgba(255,255,255,.5);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 13px var(--ring),0 0 54px 14px var(--glow),0 14px 26px -8px rgba(200,55,25,.7),inset 0 -7px 12px rgba(80,10,0,.28),inset 0 5px 10px rgba(255,255,255,.5)}}
.node.lock{background:var(--lock);box-shadow:var(--locksh);color:var(--lockink)}
.node.cp{border-radius:22px}
.node.cp.done{background:radial-gradient(circle at 35% 28%,#FFE08A 0%,#F2B21D 50%,#B77700 100%);box-shadow:0 12px 22px -8px rgba(183,119,0,.6),inset 0 -6px 10px rgba(80,50,0,.25),inset 0 4px 8px rgba(255,255,255,.5)}
.tip{position:absolute;transform:translate(-50%,-100%);padding:7px 14px;border-radius:14px;background:var(--bubble);color:var(--acct);font-weight:800;font-size:15px;box-shadow:var(--shs);z-index:3;white-space:nowrap;animation:bob 2s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,calc(-100% - 5px))}}
.walker{position:absolute;z-index:3;transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1);transform:translate(-50%,-88%)}
.nlabel{position:absolute;font-weight:700;font-size:13.5px;line-height:1.25;color:var(--ink2);width:118px;z-index:2;pointer-events:none}
.nlabel.cur{color:var(--ink);font-weight:800}

/* session overlay */
#ov{position:fixed;inset:0;z-index:40;display:none;background:var(--bgflat);overflow:hidden}
#ov::before{content:"";position:absolute;inset:0;background:var(--bg)}
#ov.on{display:block}
#conf{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sess{position:relative;z-index:1;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.shead{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink2);display:flex;align-items:center;justify-content:center;box-shadow:var(--shs);flex-shrink:0}
.prog{flex:1;height:16px;border-radius:8px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--btn);box-shadow:inset 0 3px 0 rgba(255,255,255,.35);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.sbody{flex:1;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sfoot{padding:10px 16px calc(18px + env(safe-area-inset-bottom))}
.qtop{display:flex;align-items:center;justify-content:space-between;min-height:34px;gap:8px}
.combo{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:linear-gradient(135deg,#FF9A3D,#E8550F);color:#fff;font-weight:900;font-size:15px;box-shadow:0 8px 20px -6px rgba(232,101,15,.6);transform:rotate(-3deg);animation:pop .5s cubic-bezier(.3,1.9,.5,1)}
.qrow{display:flex;align-items:flex-end;gap:4px;min-height:112px}
.qrow h1{flex:1;font-size:26px;line-height:1.18}
.qrow .mascot{margin-right:-8px}
.fig{margin:0;display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.fig blockquote{margin:0;font:700 18.5px/1.4 'Bricolage Grotesque',Inter,sans-serif;letter-spacing:-.01em}
.fig figcaption{font-weight:600;font-size:14px;color:var(--ink2)}
.fig.case p{font-size:17px;line-height:1.5;font-weight:500}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:8px;align-items:center;font-weight:700;font-size:14.5px}
.bar i{display:block;height:18px;border-radius:9px;background:var(--btn);min-width:4px}
.bar:nth-child(even) i{background:linear-gradient(135deg,#5FE0CC,#1FA595)}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;min-height:68px;padding:16px 18px;border-radius:22px;text-align:left;font-weight:700;font-size:17px;line-height:1.3;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shs);transition:transform .16s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,border-color .15s,background .15s}
.opts.two .opt{min-height:92px}
.opt:active{transform:scale(.96);box-shadow:none}
.opt.sel{background:var(--sel);border-color:var(--selline);box-shadow:0 0 0 4px var(--accs),0 14px 28px -10px rgba(214,58,28,.5);transform:translateY(-3px) scale(1.015)}
.opt.ok{background:var(--okbtn);border-color:transparent;color:#fff}
.opt.bad{background:var(--badbtn);border-color:transparent;color:#fff}
.opt.dim{opacity:.55}
.opt .mk{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center}
.opt .n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--btn);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.locked .opt{pointer-events:none}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cols .opt{min-height:60px;padding:12px 14px;font-size:15.5px}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.buckets.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.bucket{min-height:112px;border-radius:22px;border:2px dashed var(--ink3);padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left;background:var(--glass)}
.bucket.hot{border-color:var(--acc);background:var(--accs)}
.bucket b{font-weight:800;font-size:14.5px;color:var(--ink2)}
.tok{min-height:44px;padding:9px 13px;border-radius:15px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shs);font-weight:700;font-size:15px;line-height:1.25;text-align:left;transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
.tok:active{transform:scale(.95)}
.tok.sel{background:var(--sel);border-color:var(--selline);box-shadow:0 0 0 4px var(--accs)}
.tok.ok{background:var(--oks);border-color:var(--ok)}.tok.bad{background:var(--bads);border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.hint{font-weight:600;font-size:14.5px;color:var(--ink2)}
textarea.ans{width:100%;min-height:120px;border-radius:20px;border:2px solid var(--line);background:var(--solid);padding:14px 16px;font-size:16.5px;line-height:1.45;resize:vertical}
.model{padding:16px 18px;border-radius:22px;background:var(--teals);font-size:16px;line-height:1.5}
.model b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.teach{display:flex;flex-direction:column;gap:14px}
.teach .fact{padding:20px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);font-size:18.5px;line-height:1.5;font-weight:500}
.teach .fact b{font-weight:800}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* feedback sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;max-width:480px;margin:0 auto;max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-radius:32px 32px 0 0;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -20px 50px -20px rgba(26,21,51,.35);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);animation:up .5s cubic-bezier(.25,1.35,.5,1)}
@keyframes up{0%{transform:translateY(100%)}100%{transform:none}}
.shd{display:flex;align-items:center;gap:10px}
.shd .dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

<script>
/* Lesson content format.
   U({id, track, title, blurb, scene, lessons:[{t, sub, items:[[teach, question, {g, h}?], ...]}]})
   Every question travels with the text that teaches it, so nothing is ever quizzed before it is taught.
   The right answer is written first; the app shuffles options every time a question is shown. */
const UNITS=[];
function U(o){UNITS.push(o)}
const M=(q,o,x)=>({t:'mc',q,o,x});                       // o[0] is correct
const TF=(q,a,x)=>({t:'tf',q,a,x});                      // a is true or false
const PICK=(q,yes,no,x)=>({t:'pick',q,yes,no,x});        // choose every one that fits
const PAIR=(q,p,x)=>({t:'pair',q,p,x});                  // p: [[left,right],...]
const SORT=(q,g,x)=>({t:'sort',q,g,x});                  // g: {group:[items]}
const ORD=(q,o,x)=>({t:'ord',q,o,x});                    // o: items in the right order
const EX=(q,model)=>({t:'ex',q,model});                  // explain in your own words, self-rated
const SRC=(text,cite,q)=>(q.src={text,cite},q);          // read a primary source first
const DATA=(title,rows,q,note)=>(q.data={title,rows,note},q); // read a chart first: rows [[label,value,display?],...]
const CASE=(text,q)=>(q.cs=text,q);                      // apply the idea to a real situation
const TRACKS=[
 {id:'g8',name:'8th grade',sub:'Start here. Plain words, big ideas.'},
 {id:'hs',name:'High school',sub:'How the systems work and where they split.'},
 {id:'co',name:'College',sub:'Theory, evidence and the hard arguments.'},
 {id:'gr',name:'Graduate',sub:'The debates scholars still fight about.'},
 {id:'wa',name:'Seattle & Washington',sub:'Strikes, co-ops and public power close to home.'},
 {id:'live',name:'Live Desk',sub:'What is happening now. Refreshed on the 1st of each month.'}
];
function kindOf(q){return q.src?'source':q.data?'chart':q.cs?'apply':({mc:'choice',tf:'choice',pick:'pick',pair:'match',sort:'sort',ord:'order',ex:'explain'})[q.t]}
function prepContent(){
 const QS={};
 UNITS.forEach(u=>{u.qs=[];u.lessons.forEach((l,li)=>{l.items=l.items.map((it,qi)=>{const q=it[1];q.id=u.id+'.'+li+'.'+qi;q.teach=it[0];q.unit=u.id;q.kind=kindOf(q);if(it[2]){q.g=it[2].g;q.h=it[2].h}QS[q.id]=q;u.qs.push(q);return q})})});
 return QS}
if(typeof module!=='undefined')module.exports={UNITS,U,M,TF,PICK,PAIR,SORT,ORD,EX,SRC,DATA,CASE,TRACKS,kindOf,prepContent};

/* ===== 8th grade: plain words, big ideas ===== */
U({id:'g8a',track:'g8',title:'The big words',scene:'meadow',blurb:'Capitalism, socialism and communism: what each word really means.',lessons:[
{t:'Who owns the bakery?',sub:'Capitalism and socialism',items:[
 ["An **economic system** is the set of rules a society uses to decide who owns things, who does the work, and who gets what is made.",
  M("What does an economic system decide?",["Who owns things and who gets what is made","Which party will win the next big election","What language the schools have to teach in","How tall new buildings are allowed to be"],"An economic system is about ownership, work and who gets the results.")],
 ["The **means of production** are the things used to make goods: factories, farms, machines, tools and land. A bakery's ovens count. The loaf you take home does not.",
  SORT("Means of production, or personal belongings?",{"Means of production":["A factory","A fleet of delivery trucks","Farmland"],"Personal belongings":["Your toothbrush","Your sneakers","Your phone"]},"Means of production are used to make things for sale. Personal belongings are for your own use.")],
 ["Under **capitalism**, most means of production are privately owned. Owners hire workers for wages and try to earn a profit by selling in markets.",
  CASE("Dana owns a bakery. She pays six bakers an hourly wage and keeps whatever money is left after the bills are paid.",M("Which system does this describe?",["Capitalism","Socialism","Communism","A planned economy"],"A private owner, hired wage workers and profit are the basic parts of capitalism.")),{g:"Dana keeps the profit. I keep the crumbs. We all have a system."}],
 ["Under **socialism**, the means of production are owned in common: by the workers themselves, by the community, or by the public through the government. The aim is for the people who do the work to share control and the rewards.",
  PICK("Which of these are examples of social ownership?",["A bakery owned by its bakers","A water system owned by a city","A railway owned by the public"],["A bakery owned by one investor","A chain owned by shareholders"],"Social ownership can mean workers, a community or the public as a whole. One investor or a group of shareholders is private ownership.")],
 ["Socialists draw a line between **personal property** (your clothes, your phone, your home) and **productive property** (a factory or large farm where other people work). Socialism is about the second kind.",
  TF("Socialism means the government takes your clothes and your toothbrush.",false,"Socialist ideas are about who owns workplaces and resources, not your personal things. Critics reply that in practice some governments did seize homes and small shops too.")]
]},
{t:'Communism: the far horizon',sub:'One word, two meanings',items:[
 ["In the writing of Karl Marx, **communism** is a future society with no social classes, no money and no state, where goods are shared freely.",
  SRC("From each according to his ability, to each according to his needs!","Karl Marx, Critique of the Gotha Programme, 1875",M("What is this slogan describing?",["People give what they can and take what they need","Every worker is paid exactly the same wage, whatever the job","The hardest workers get the most goods","The state assigns each person a job"],"The slogan describes sharing by need. It is not equal pay, and it is not pay for effort."))],
 ["No country has ever reached that stage. The Soviet Union and China were run by **Communist parties**, and they called their own systems socialist: a step on the way.",

  SORT("Which meaning of 'communism' fits?",{"The far-off goal":["No social classes","No state at all","Goods shared by need"],"One-party states":["A single ruling party","A powerful secret police","Five-year plans"]},"Marx's goal had no state. The countries run by Communist parties had very strong states.")],
 ["A **market** is buying and selling where prices move with supply and demand. A **planned economy** is one where a central office decides what gets made and what it costs. Real countries mix the two.",
  PAIR("Match each idea to what it looks like.",[["Market","Prices move with supply and demand"],["Central plan","An office sets production targets"],["Private ownership","A person or company owns the firm"],["Social ownership","Workers or the public own the firm"]],"Ownership (private or social) and coordination (market or plan) are two separate questions.")],
 ["To sum up: capitalism and socialism differ most on **who owns the workplaces**. Communism, in Marx's sense, is a further stage where classes and the state are gone.",
  EX("In your own words, what is the main difference between capitalism and socialism?","It comes down to who owns the means of production. Under capitalism, private owners own the factories, farms and companies and hire workers for wages. Under socialism those things are owned in common, by the workers, the community or the public.")]
]}]});

U({id:'g8b',track:'g8',title:'Cousins, not twins',scene:'city',blurb:'Social democracy, democratic socialism and the welfare state are easy to mix up.',lessons:[
{t:'Is Sweden socialist?',sub:'Socialism versus the welfare state',items:[
 ["A **welfare state** is a government that uses taxes to pay for things like health care, schools, pensions and help for people out of work. Most rich countries have one, and most of their businesses are still privately owned.",
  M("What makes a country a welfare state?",["Taxes pay for health care, schools and other supports","The government owns every business, large and small","Workers elect the boss of each company","Money has been ended and goods are free"],"A welfare state is about public services paid for by taxes. Who owns the businesses is a different question.")],
 ["**Social democracy** keeps capitalism (private businesses and markets) but adds a strong welfare state, strong unions and rules on business. Sweden, Denmark and Norway are the usual examples.",
  CASE("In Denmark, most companies are privately owned and compete in markets. Taxes are high, and they pay for free college, health care and long parental leave.",M("What is the best label for this setup?",["Social democracy","Communism","Pure free-market capitalism","A planned economy"],"Private firms plus a big welfare state is social democracy. A Danish prime minister once said plainly that Denmark is a market economy, not a planned socialist one.")),{g:"Free college and everybody bikes. Suspicious. Where do the fries come from?"}],
 ["So **public services are not the same as socialism**. A public library or a fire department is a public service inside a capitalist economy. Socialism is about who owns and runs the workplaces.",
  SORT("Sort each example.",{"Welfare state program":["Public pensions for retirees","Free school lunches","Unemployment payments"],"Social ownership of a workplace":["A factory owned by its workers","A grocery store owned by its shoppers","A power company owned by the public"]},"Programs hand out services or money. Social ownership changes who owns and controls an enterprise.")],
 ["People on different sides blur these on purpose. Some critics call any public program 'socialism' to make it sound scary. Some fans call Nordic countries 'socialist' to make socialism sound safe.",
  TF("A country with public schools and public roads is socialist by definition.",false,"Nearly every capitalist country has public schools and roads. Those are public services, not social ownership of the economy.")],
 ["The Nordic countries do have some socialist-leaning features: very strong unions, and in Norway a huge publicly owned oil fund. But most of their economy is private business.",
  DATA("Share of workers who belong to a union (about 2019 to 2020)",[["Denmark",67,"67%"],["Sweden",65,"65%"],["Germany",16,"16%"],["United States",10,"10%"]],M("What does this chart show about the Nordic countries?",["Far more of their workers are in unions","Their governments own all the factories","Their workers are paid less than Americans","They have fewer workers than Germany"],"Union membership in Denmark and Sweden is several times higher than in Germany or the United States. That is a big part of the Nordic model."),"Source: OECD")]
]},
{t:'Two kinds of socialist',sub:'Democratic socialism and its neighbors',items:[
 ["**Democratic socialism** wants to go beyond the welfare state to real social ownership of big parts of the economy, and to get there through elections and keep free speech and many parties.",
  M("How do democratic socialists differ from social democrats?",["They also want social ownership","They want to end elections and rule by one party","They oppose labor unions","They want lower taxes on business"],"Social democrats keep capitalism and soften it. Democratic socialists want to replace private ownership of major industries, by democratic means.")],

U({id:'g8c',track:'g8',title:'Where the ideas came from',scene:'mill',blurb:'Smoke, factories and the people who thought there had to be a better way.',lessons:[
{t:'The factory age',sub:'Why socialism appeared when it did',items:[
 ["In the **Industrial Revolution** (starting in Britain in the late 1700s), work moved from farms and home workshops into factories with machines. Cities grew fast.",

 ["Early factory life was harsh. Shifts of 12 to 14 hours were common, pay was low, and young children worked in mills and mines.",
  SRC("I have to trap without a light and I'm scared. I go at four and sometimes half past three in the morning, and come out at five and half past.","Sarah Gooder, age 8, coal mine worker, to a British government commission, 1842",M("What does this source tell us about early industrial work?",["Children worked very long days","Mines closed during the winter","Workers set their own hours","Schools were built at the mines"],"Reports like this shocked the public and led to the first laws limiting child labor."))],
 ["The first socialists are often called **utopian socialists**. Robert Owen in Britain and Charles Fourier in France believed model communities could show the world a kinder way to live and work.",

]},
{t:'Marx and Engels',sub:'A new kind of socialism',items:[

  M("What was The Communist Manifesto?",["A short pamphlet from 1848","A law passed in Russia","A novel about a mill town","A speech to the U.S. Congress"],"Marx and Engels wrote it for a small group called the Communist League.")],

U({id:'g8d',track:'g8',title:'Revolutions and experiments',scene:'world',blurb:'What happened when people tried to put these ideas into practice.',lessons:[
{t:'Russia and after',sub:'The first Communist state',items:[
 ["In 1917, during the First World War, Russia's emperor (the **tsar**) was overthrown. Months later the **Bolsheviks**, a Marxist party led by **Vladimir Lenin**, took power in the October Revolution.",
  ORD("Put these events in order.",["Russia enters the First World War","The tsar is overthrown","The Bolsheviks take power","The Soviet Union is formed"],"The war came in 1914, both revolutions in 1917, and the Soviet Union was founded in 1922.")],
