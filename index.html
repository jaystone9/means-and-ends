  EX("In your own words, why is Seattle's $15 wage law often called a turning point?","It was the first big U.S. city to adopt $15, at a time when the federal minimum was $7.25 and the idea was widely called impossible. It came out of strikes by low-wage workers and a socialist's election, and after it passed, other cities and states followed. It also became a real-world test that economists still study to see whether high minimum wages reduce jobs.")]
]},
{t:'Taxes, housing and a new mayor',sub:'2021 to now',items:[
 ["Washington has no general income tax, and its tax system has long ranked among the most regressive in the country. In 1933 the state Supreme Court struck down a voter-approved income tax, reasoning that income is property and must be taxed uniformly.",
  M("Why has Washington had no graduated income tax since the 1930s?",["A court ruling treated income as property","Voters never approved one","The federal government forbade states to have one","The state has no constitution"],"Voters had approved one in 1932. The court struck it down the next year.")],
 ["In 2021 the Legislature passed a 7 percent tax on **capital gains** above $250,000. The state Supreme Court upheld it in 2023 as an excise tax, and in 2024 voters rejected an initiative to repeal it.",
  ORD("Put Washington's recent tax fights in order.",["Capital gains tax passed","State Supreme Court upholds it","Voters reject repealing it","A 9.9% tax on income over $1 million is signed"],"2021, 2023, 2024, and March 2026.")],
 ["In March 2026 Governor Bob Ferguson signed a 9.9 percent tax on household income above $1 million, to start in 2028. Opponents sued, arguing it violates the 1933 precedent. In November 2026 voters defeated an initiative to repeal it.",
  SORT("Who makes each argument about the tax on income over $1 million?",{"Supporters":["Working families pay a larger share now","It funds child care and schools"],"Opponents":["The state constitution forbids it","High earners and firms may leave","The threshold could be lowered later"]},"The court case was still pending when this lesson was last updated.")],
 ["**Social housing** is publicly owned, permanently affordable housing open to a mix of incomes, with rents from better-off tenants helping cover costs. Seattle voters created a Social Housing Developer in 2023 and in February 2025 funded it with a tax on employers for pay above $1 million.",
  CASE("A public developer buys an apartment building. A nurse, a barista and a software tester all rent there, each paying about 30 percent of their income. The building is never sold.",M("What is this model called?",["Social housing","Public power","A consumer co-op","Rent control"],"Vienna is the model's best-known example. Seattle's developer has been slow to start, and its board fired its first chief executive in January 2026."))],
 ["In November 2025 Seattle elected **Katie Wilson** mayor by about 2,000 votes. She co-founded the Transit Riders Union in 2011, had never held office, and calls herself a socialist.",
  TF("Katie Wilson was a longtime city council member before becoming mayor.",false,"She came from community organizing and had held no office. Her first budget, proposed in September 2026, included no new taxes and more money for police, which disappointed some supporters.")],
 ["So Seattle is again a test case. The questions are the old ones: can a city tax wealth that can move, can public agencies build well, and does governing change the people who do it?",
  EX("What is social housing, and how is it different from traditional public housing?","Social housing is owned by a public agency and kept permanently off the private market, like public housing. The difference is who lives there: instead of only the poorest households, it mixes people across incomes, each paying a share of income as rent, so higher rents help subsidize lower ones and the buildings are less isolated and easier to maintain.")]
]}]});

 ["**Zohran Mamdani**, a member of the Democratic Socialists of America, took office as mayor of New York City on January 1, 2026. He ran on a rent freeze, free buses, city-owned grocery stores and universal child care.",
  SORT("Where did each promise stand by fall 2026?",{"Done or under way":["A rent freeze for stabilized apartments","A child care pilot for two-year-olds"],"Not done":["Fare-free buses","A new income tax on millionaires","City grocery stores open to shoppers"]},"The first grocery site, in East Harlem, was named in April 2026, with opening planned for 2027.")],
 ["In June 2026 the city's Rent Guidelines Board, most of whose members the mayor appoints, voted 7 to 1 to freeze rents on about one million rent-stabilized apartments for leases starting that October.",
  M("How was the rent freeze carried out?",["By a vote of a board the mayor appoints","By a law passed in Congress and signed in Washington","By a citywide referendum","By an order from the governor"],"A mayor cannot freeze rents alone, but can appoint the board that sets them. Landlord groups argue a freeze starves older buildings of repair money.")],
 ["Free buses needed money and approval from the state, which controls the transit agency. State lawmakers left it out of the 2026 budget, and the mayor acknowledged it would not happen that year.",
  CASE("A mayor promises fare-free buses. The buses are run by a state agency, and the state legislature declines to fund the plan.",M("What limit on city socialism does this show?",["Cities depend on higher levels of government","Voters dislike buses and prefer to drive downtown","Mayors cannot appoint anyone","Bus drivers opposed the plan"],"The same limit applied to his proposed city income tax on millionaires, which needed state approval and did not pass."))],
 ["In Seattle, **Katie Wilson**, who calls herself a socialist, became mayor in January 2026. Her first proposed budget ($9.1 billion, September 2026) had no new taxes, raised police funding and set a goal of 1,000 new shelter units.",
  TF("Katie Wilson's first proposed budget cut police funding and added several new taxes.",false,"It raised police funding and added no new taxes. Supporters called that realism in a tight budget year. Critics on the left called it a retreat, and critics on the right said it showed campaign promises were unaffordable.")],
 ["Both mayors show a pattern as old as Milwaukee's sewer socialists: in office, socialists spend most of their time on budgets, services and negotiations with other levels of government.",
  EX("In your own words, what do Mamdani's and Wilson's first years suggest about what a socialist mayor can and cannot do?","A mayor can use the powers the office really has, like appointing a rent board, writing a budget and starting pilot programs. But cities cannot print money, must balance budgets, and need state approval for most new taxes and for services run by state agencies. So the biggest promises, such as free transit or taxing the rich, depend on winning over governors and legislatures, and the mayor ends up judged on everyday management as much as on ideals.")]
]},

const NAMES={gus:'Gus the seagull',hazel:'Hazel the beaver'};
/* App-level pose names map onto each character's own acting. */
const ALIAS={gus:{right:'cheer',wrong:'facepalm',comfort:'notcare'},hazel:{right:'cheer',wrong:'wince',comfort:'comfort'}};
const SNAP={idle:.1,think:1,cheer:.27,facepalm:1.5,wince:.4,hyped:.2,notcare:1.5,comfort:1,dance:.25,hop:.2,sad:1};
const SPRING={rootY:[520,24],squash:[700,13],pupX:[500,30],pupY:[500,30],lid:[700,40],flip:[260,22],palm:[220,17],happy:[900,60],heartY:[120,14]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function targets(who,pose,t,T,o){

 if(who==='gus'){
  c={rootX:0,rootY:0,rot:0,spin:0,headRot:4*s(T*.7),headY:0,wingL:0,wingR:0,tail:0,pupX:[0,5,0,-5][Math.floor(T/2.2)%4],pupY:0,lid:.35,browL:-14,browR:6,browY:0,mouth:0,palm:0,flip:1,fry:1,shades:0,spark:0,squash:0,sweat:0};
  if(pose==='idle'){if(T%4.3<.25)c.wingR=-18;if(T%3.1<.2)c.tail=14;if(T%5.2<.5)c.mouth=.3*Math.abs(s(T*14))}
  else if(pose==='think'){const lx=P.lookX||0,ly=P.lookY||0;c.rot=6*lx;c.headRot=12*lx;c.headY=4;c.pupX=6*lx;c.pupY=3+4*ly;c.lid=.12;c.browL=-16;c.browR=-2;c.browY=-3;c.wingR=-35+5*s(T*3)}
  else if(pose==='cheer'){hop(.9,.55,44);c.wingL=95+25*s(t*24);c.wingR=-150+18*s(t*12);c.lid=0;c.mouth=1;c.browY=-7;c.browL=-6;c.browR=-6;c.spark=.8;c.fry=0;c.headRot=-6;c.tail=18*s(t*20)}
  else if(pose==='facepalm'){const r=Math.min(1,t/1.2);c.palm=1;c.headRot=10;c.headY=6;c.lid=.62;c.pupX=4*Math.cos(t*5)*(1-r);c.pupY=-5;c.browL=-4;c.browR=4;c.browY=2;c.rot=-3;c.sweat=1;c.fry=0;c.squash=.04*s(t*3)}
  else if(pose==='hyped'){const k=clamp(P.combo||3,3,10),per=Math.max(.42,.85-.05*k);const h=hop(per,.4,34+6*k);if(k>=5&&h.n%2===1&&h.c<.4)c.spin=360*(h.c/.4);
   c.wingL=110+35*s(t*30);c.wingR=-110-35*s(t*30);c.lid=0;c.mouth=1;c.browY=-8;c.browL=-8;c.browR=-8;c.spark=Math.min(1.3,.5+k*.1);c.shades=k>=6?1:0;c.fry=0;c.tail=25*s(t*25)}
  else if(pose==='notcare'){c.flip=-1;c.pupX=(T%3.2)<1.1?-6:5;c.lid=.55;c.browL=10;c.browR=-8;c.headRot=-10;c.wingL=-25;c.wingR=25;c.mouth=.35*Math.abs(s(t*9))}
  else if(pose==='sad'){c.lid=.5;c.browL=14;c.browR=-14;c.headY=8;c.headRot=6;c.pupY=4;c.fry=0;c.squash=.05}
  else if(pose==='hop'){hop(.5,.34,26);c.wingL=40+20*s(t*20);c.wingR=-40-20*s(t*20);c.lid=.1;c.mouth=.4}
  else if(pose==='dance'){const per=.5,b=Math.floor(t/per),ph=(t%per)/per,d=b%2?1:-1;c.rootX=12*d;c.rot=10*d;c.rootY=-16*s(Math.PI*ph);c.squash=(ph>.85||ph<.1)?.08:-.04;
   c.wingL=b%2?140:40;c.wingR=b%2?-40:-140;c.shades=1;c.mouth=.6;c.lid=0;c.browY=-5;c.tail=22*s(t*12);c.spark=.5;c.fry=0;c.headRot=-8*d}
 }else{
  c={rootX:0,rootY:0,rot:0,spin:0,headRot:3*s(T*.8),headY:0,armL:0,armR:0,tail:5*s(T*2),pupX:[0,4,0,-4][Math.floor(T/2.6)%4],pupY:0,lid:0,browL:-4,browR:-4,browY:0,mouth:0,smile:1,happy:0,stick:1,spark:0,squash:0,heart:0,heartY:0};
  if(pose==='idle'){if(T%5.5<.3)c.armR=-12}
  else if(pose==='think'){const lx=P.lookX||0,ly=P.lookY||0;c.rot=6*lx;c.headRot=10*lx;c.headY=3;c.pupX=5*lx;c.pupY=2+3*ly;c.browL=-8;c.browR=2;c.browY=-2;c.armR=-55+4*s(T*3)}
  else if(pose==='cheer'){hop(.9,.55,40);c.armL=125+15*s(t*18);c.armR=-125-15*s(t*18);c.happy=1;c.mouth=1;c.browY=-5;c.spark=.8;c.stick=0;c.tail=20*s(t*18)}
  else if(pose==='wince'){if(t<.8){c.squash=.09;c.lid=.75;c.browL=-16;c.browR=-16;c.mouth=.4;c.smile=-1;c.rot=-4;c.armL=30;c.armR=-30;c.pupX=0}
   else{const u=t-.8;c.headY=u<1.4?7*Math.max(0,s(u*9)):0;c.lid=.15;c.smile=1.2;c.mouth=.15;c.browL=-6;c.browR=-6;c.armR=-70;c.pupX=0}}
  else if(pose==='hyped'){const k=clamp(P.combo||3,3,10),per=Math.max(.42,.85-.05*k);const h=hop(per,.4,34+6*k);if(k>=5&&h.n%2===1&&h.c<.4)c.spin=-360*(h.c/.4);
   c.armL=135+30*s(t*26);c.armR=-110-30*s(t*26);c.happy=1;c.mouth=1;c.browY=-6;c.spark=Math.min(1.3,.5+k*.1);c.stick=0;c.tail=25*s(t*22)}
  else if(pose==='comfort'){c.rot=6;c.armL=62+14*s(t*2.4);c.armR=-62-14*s(t*2.4);c.happy=1;c.mouth=.2;c.headRot=10+3*s(t*2.4);c.heart=1;c.heartY=4+6*s(t*2.2);c.stick=0}
  else if(pose==='sad'){c.lid=.4;c.browL=-14;c.browR=-14;c.headY=6;c.smile=-.6;c.pupY=3}
  else if(pose==='hop'){hop(.5,.34,24);c.armL=40;c.armR=-40;c.mouth=.4;c.stick=0}
  else if(pose==='dance'){const per=.5,b=Math.floor(t/per),ph=(t%per)/per,d=b%2?1:-1;c.rootX=12*d;c.rot=10*d;c.rootY=-16*s(Math.PI*ph);c.squash=(ph>.85||ph<.1)?.08:-.04;
   c.armL=b%2?130:40;c.armR=b%2?-40:-130;c.happy=1;c.mouth=.8;c.tail=30*s(t*12);c.spark=.5;c.stick=0;c.headRot=-8*d}
 }
 return c}

const KEEP={};   // spring state by key, so a re-render does not restart a mascot's motion
let LIVE=[],raf=0,last=0,T=0,defsIn=false;

function Inst(el){
 this.el=el;this.who=el.dataset.m==='hazel'?'hazel':'gus';this.key=el.dataset.key||'';
 const size=+el.dataset.size||120;
 el.innerHTML='<svg viewBox="-20 -40 240 270" width="'+size+'" height="'+Math.round(size*270/240)+'" role="img" aria-label="'+NAMES[this.who]+'" style="display:block;overflow:visible">'+(this.who==='gus'?GUS:HAZ)+'</svg>';
 this.p={};el.querySelectorAll('[data-p]').forEach(n=>{this.p[n.dataset.p]=n});
 const k=this.key&&KEEP[this.key];
 this.st=k&&k.who===this.who?k:{who:this.who,ch:null,vel:{},pose:'',t0:T,poke:-9};
 if(this.key)KEEP[this.key]=this.st;
}
Inst.prototype.pose=function(){const raw=this.el.dataset.pose||'idle';return (ALIAS[this.who][raw])||raw};
Inst.prototype.opts=function(){const d=this.el.dataset;return{lookX:+d.lx||0,lookY:+d.ly||0,combo:+d.combo||3}};
Inst.prototype.step=function(dt){
 const s=this.st,pose=this.pose();if(pose!==s.pose){s.pose=pose;s.t0=T}
 const tg=targets(this.who,pose,T-s.t0,T,this.opts());
 const pk=T-s.poke;if(pk>=0&&pk<.75){const a=Math.sin(Math.PI*pk/.75);tg.rootY=-32*a;tg.squash=-.06*a;tg.mouth=.8;tg.lid=0;if(this.who==='gus'){tg.spin=360*(pk/.75);tg.browY=-6}else{tg.happy=1;tg.armL=110*a;tg.armR=-110*a}}
 if(!s.ch)s.ch=Object.assign({},tg);
 for(const k in tg){if(k==='spin'){s.ch.spin=tg.spin;continue}const sp=SPRING[k]||[240,15];const x=s.ch[k]==null?tg[k]:s.ch[k];const v=s.vel[k]||0;const a=sp[0]*(tg[k]-x)-sp[1]*v;s.vel[k]=v+a*dt;s.ch[k]=x+s.vel[k]*dt}
 this.draw(s.ch,true)};
Inst.prototype.still=function(){const pose=this.pose();const tg=targets(this.who,pose,SNAP[pose]||.1,SNAP[pose]||.1,this.opts());tg.spin=0;this.draw(tg,false)};
Inst.prototype.draw=function(c,live){
 const p=this.p,A=(n,k,v)=>{const e=p[n];if(e)e.setAttribute(k,v)};
 const gus=this.who==='gus';
 const blink=live&&c.lid<.5&&(T%(gus?3.8:4.2))<.13?1:0;const lid=clamp(Math.max(c.lid,blink),0,1);
 const br=live?1+.019*Math.sin(T*2.3):1;const sx=1+c.squash*.8,sy=(1-c.squash)*br;
 const sp=Math.max(0,c.spark),tw=T*90;
 A('aura','r',90+sp*20);A('aura','opacity',Math.min(.6,sp*.5));
 A('shadow','rx',(gus?58:60)*(1-Math.min(.5,-c.rootY/110)));
 A('root','transform','translate('+c.rootX+' '+c.rootY+') rotate('+(c.rot+(c.spin||0))+' 100 140) translate(100 206) scale('+sx+' '+sy+') translate(-100 -206)');
 A('pup','transform','translate('+c.pupX+' '+c.pupY+')');
 A('s1','transform','translate(8 40) rotate('+tw+') scale('+sp+')');A('s2','transform','translate(192 30) rotate('+(-tw)+') scale('+sp+')');
 A('s3','transform','translate(-4 140) rotate('+(-tw)+') scale('+sp*.8+')');A('s4','transform','translate(204 120) rotate('+tw+') scale('+sp*.8+')');
 if(gus){
  let fl=c.flip;if(Math.abs(fl)<.06)fl=fl<0?-.06:.06;const palm=clamp(c.palm,0,1),m=Math.max(0,c.mouth);
  A('flip','transform','translate(100 0) scale('+fl+' 1) translate(-100 0)');
  A('tail','transform','rotate('+c.tail+' 146 168)');A('wingL','transform','rotate('+c.wingL+' 50 126)');A('wingR','transform','rotate('+c.wingR+' 150 126)');A('wingR','opacity',1-palm);
  A('head','transform','translate(0 '+c.headY+') rotate('+c.headRot+' 100 120)');
  A('lidL','height',32*lid);A('lidLb','y',64.5+32*lid);A('lidR','height',34*lid);A('lidRb','y',61.5+34*lid);
  A('browL','transform','translate(0 '+c.browY+') rotate('+c.browL+' 80 61)');A('browR','transform','translate(0 '+c.browY+') rotate('+(-c.browR)+' 123 57)');
  A('shades','opacity',clamp(c.shades,0,1));A('mouth','ry',2+m*10);A('lower','transform','rotate('+m*18+' 96 112)');
  A('fry','opacity',clamp(c.fry,0,1));A('fry','transform','rotate('+m*18+' 96 112)');
  A('palm','opacity',palm);A('palm','transform','translate('+((1-palm)*40)+' '+((1-palm)*70)+')');A('sweat','opacity',clamp(c.sweat,0,1));
 }else{
  const m=Math.max(0,c.mouth),lh=22*lid,hap=c.happy>.5;
  A('tail','transform','rotate('+c.tail+' 130 186)');A('head','transform','translate(0 '+c.headY+') rotate('+c.headRot+' 100 112)');
  A('armL','transform','rotate('+c.armL+' 58 130)');A('armR','transform','rotate('+c.armR+' 142 130)');
  A('lidL','height',lh);A('lidLb','y',53+lh);A('lidR','height',lh);A('lidRb','y',53+lh);
  A('happy','opacity',hap?1:0);A('open','opacity',hap?0:1);
  A('browL','transform','translate(0 '+c.browY+') rotate('+c.browL+' 80 41)');A('browR','transform','translate(0 '+c.browY+') rotate('+(-c.browR)+' 120 41)');
  A('mouth','cy',109+m*3);A('mouth','rx',9+m*3);A('mouth','ry',1+m*8);A('smile','d','M84 101 Q100 '+(110+c.smile*5)+' 116 101');A('teeth','transform','translate(0 '+(m*3)+')');
  A('stick','opacity',clamp(c.stick,0,1));A('heart','opacity',clamp(c.heart,0,1));A('heart','transform','translate(0 '+(-c.heartY)+')');
 }};

function frame(now){
 raf=0;const dt=Math.min(.033,Math.max(.001,(now-last)/1000));last=now;T+=dt;
 LIVE=LIVE.filter(i=>i.el.isConnected);
 for(const i of LIVE)i.step(dt);
 if(LIVE.length&&!document.hidden)raf=requestAnimationFrame(frame)}
function kick(){if(!raf&&LIVE.length&&!reduce()&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',kick);

/* Mount every <span class="mascot" data-m="gus|hazel" data-pose="..." data-size="..." data-key="..."> on the page. */
function sync(root){
 if(!defsIn){defsIn=true;document.body.insertAdjacentHTML('afterbegin',DEFS)}
 (root||document).querySelectorAll('.mascot:not([data-on])').forEach(el=>{el.dataset.on='1';const i=new Inst(el);el._m=i;if(reduce())i.still();else{i.step(.016);LIVE.push(i)}});
 kick()}
function setPose(el,pose,extra){if(!el)return;el.dataset.pose=pose;if(extra)for(const k in extra)el.dataset[k]=extra[k];if(el._m&&reduce())el._m.still()}
function look(x,y){LIVE.forEach(i=>{if((i.el.dataset.pose||'')!=='think')return;const b=i.el.getBoundingClientRect();const dx=x-(b.left+b.width/2),dy=y-(b.top+b.height/2);const d=Math.max(60,Math.hypot(dx,dy));i.el.dataset.lx=clamp(dx/d*1.2,-1,1).toFixed(2);i.el.dataset.ly=clamp(dy/d*1.2,-1,1).toFixed(2)})}
function poke(el){if(el&&el._m){el._m.st.poke=T}}
function html(who,pose,size,key,extra){return '<span class="mascot" data-m="'+who+'" data-pose="'+(pose||'idle')+'" data-size="'+(size||120)+'"'+(key?' data-key="'+key+'"':'')+(extra||'')+'></span>'}
function forget(prefix){Object.keys(KEEP).forEach(k=>{if(k.indexOf(prefix)===0)delete KEEP[k]})}
return {sync,setPose,look,poke,html,forget,NAMES};
})();

/* ===== Means & Ends game engine ===== */
'use strict';
const KEY='meansandends.v1';
const QS=prepContent();
const MAXH=5,HEART_MS=30*60*1000,SRS_GAP=[1,3,7,14,30];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const reduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');

let st;
function fresh(){return {v:1,name:'',track:'g8',xp:0,days:{},goal:20,streak:0,lastDay:'',hearts:MAXH,heartAt:0,done:{},cp:{},srs:{},mistakes:[],theme:'auto',ob:false,lb:{joined:false,id:'',name:''},rem:{on:false,freq:'off',hour:19,id:'',key:''},right:0,wrong:0}}
function load(){st=fresh();try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.v===1){Object.assign(st,o);st.lb=Object.assign(fresh().lb,o.lb||{});st.rem=Object.assign(fresh().rem,o.rem||{})}}catch(e){}
 if(!TRACKS.some(t=>t.id===st.track))st.track='g8';
 /* The Live Desk is rewritten each month: when its date stamp changes, it opens up to be played again. */
 const lv=UNITS.find(u=>u.id==='live');if(lv&&st.liveStamp!==lv.stamp){Object.keys(st.done).forEach(k=>{if(k.indexOf('live/')===0)delete st.done[k]});delete st.cp.live;st.mistakes=st.mistakes.filter(id=>id.indexOf('live.')!==0);st.liveStamp=lv.stamp}
st.mistakes=st.mistakes.filter(id=>QS[id])}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}lbPush();remPush()}
function heartsTick(){if(st.hearts>=MAXH){st.heartAt=0;return}if(!st.heartAt)st.heartAt=Date.now();const n=Math.floor((Date.now()-st.heartAt)/HEART_MS);if(n>0){st.hearts=Math.min(MAXH,st.hearts+n);st.heartAt=st.hearts>=MAXH?0:st.heartAt+n*HEART_MS}}
function loseHeart(){heartsTick();if(st.hearts>0){st.hearts--;if(!st.heartAt)st.heartAt=Date.now()}}
function nextHeartIn(){if(st.hearts>=MAXH||!st.heartAt)return '';const ms=Math.max(0,st.heartAt+HEART_MS-Date.now());return Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60)}
function dayXP(){return st.days[today()]||0}
function liveStreak(){return (st.lastDay===today()||st.lastDay===addDays(today(),-1))?st.streak:0}
function addXP(n){const t=today();st.xp+=n;st.days[t]=(st.days[t]||0)+n;if(st.lastDay!==t){st.streak=st.lastDay===addDays(t,-1)?st.streak+1:1;st.lastDay=t}}
function weekXP(){const ws=weekStart();let t=0;for(let i=0;i<7;i++)t+=st.days[addDays(ws,i)]||0;return t}
function addMistake(id){if(!st.mistakes.includes(id))st.mistakes.push(id);st.srs[id]={box:0,due:today()}}
function srsRight(id){const s=st.srs[id];if(!s)return;s.box++;if(s.box>=SRS_GAP.length){delete st.srs[id];st.mistakes=st.mistakes.filter(x=>x!==id)}else s.due=addDays(today(),SRS_GAP[s.box])}
function weakDue(){const t=today();return st.mistakes.filter(id=>QS[id]&&(!st.srs[id]||st.srs[id].due<=t))}
function applyTheme(){let t=st.theme;if(t==='auto'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}document.documentElement.dataset.theme=t;const m=$('meta[name=theme-color]');if(m)m.content=t==='dark'?'#1B1233':'#FFF1E9'}

const trackUnits=id=>UNITS.filter(u=>u.track===id);
const lkey=(u,i)=>u.id+'/'+i;
const lessonDone=(u,i)=>!!st.done[lkey(u,i)];
const unitDone=u=>!!st.cp[u.id];
function unitOpen(u){const us=trackUnits(u.track);const i=us.indexOf(u);return i<=0||unitDone(us[i-1])}
function unitNodes(u){const ns=u.lessons.map((l,i)=>({u,li:i,cp:false,done:lessonDone(u,i)}));ns.push({u,li:-1,cp:true,done:unitDone(u)});return ns}
function nextNode(track){for(const u of trackUnits(track||st.track)){if(!unitOpen(u))break;const n=unitNodes(u).find(n=>!n.done);if(n)return n}return null}
function doneUnits(){return UNITS.filter(unitDone).length}

function remRow(){
 if(!remSupported())return '<div class="setrow"><span>Play reminders<br><small>Available in the installed app at jaystone9.github.io/means-and-ends</small></span></div>';
 const iosTip=isIOS()&&!isStandalone()?'<br><small>On iPhone: tap Share, then Add to Home Screen, and open it from there.</small>':'';
 const blocked=Notification.permission==='denied'?'<br><small>Notifications are blocked for this app in your device settings.</small>':'';
 return '<div class="setrow"><span>Play reminders<br><small>From Gus, and only if you haven\'t played yet that day</small>'+iosTip+blocked+'</span><select data-in="remfreq" aria-label="Play reminders">'+REM_FREQ.map(f=>'<option value="'+f[0]+'"'+(st.rem.freq===f[0]?' selected':'')+'>'+f[1]+'</option>').join('')+'</select></div>'+
 (st.rem.on?'<div class="setrow"><span>Remind me at</span><select data-in="remhour" aria-label="Reminder time">'+[7,8,9,12,15,17,18,19,20,21].map(x=>'<option value="'+x+'"'+(st.rem.hour===x?' selected':'')+'>'+hourLabel(x)+'</option>').join('')+'</select></div>':'')}

/* ---------- actions ---------- */
function unitById(id){return UNITS.find(u=>u.id===id)}
function guideHTML(u){return '<h2>'+esc(u.title)+'</h2><p class="muted">'+esc(u.blurb)+'</p><div class="guide">'+u.lessons.map((l,i)=>'<h3>'+(i+1)+'. '+esc(l.t)+'</h3><ul>'+l.items.map(q=>'<li>'+rich(q.teach)+'</li>').join('')+'</ul>').join('')+'</div>'}
const ACT={
 tab(el){const t=el.dataset.t;if(t===tab&&t==='learn'){toCurrent(true);return}tab=t;render();if(t==='learn')toCurrent(false);else window.scrollTo(0,0);if(t==='friends')lbLoad()},
 totop(){window.scrollTo({top:0,behavior:reduce()?'auto':'smooth'})},
 go(){const n=nextNode();if(n)startNode(n.u,n.cp?n.u.lessons.length:n.li)},
 node(el){const u=unitById(el.dataset.u),i=+el.dataset.i,ns=unitNodes(u),n=ns[i],nx=nextNode();
  if(nx&&nx.u===u&&((nx.cp&&n.cp)||(!nx.cp&&!n.cp&&nx.li===n.li)))return startNode(u,i);
  if(n.done)return modal('<h2>'+esc(n.cp?u.title+' checkpoint':u.lessons[i].t)+'</h2><p class="muted">'+(n.cp?'You passed this checkpoint.':esc(u.lessons[i].sub||'')+' You finished this lesson.')+'</p><button class="btn" data-a="redo" data-u="'+u.id+'" data-i="'+i+'">'+(n.cp?'Take it again':'Practice it again')+'</button>');
  toast(unitOpen(u)?'Finish the lessons before this one first.':'Pass the checkpoint before this unit to open it.')},
 redo(el){closeModal();startNode(unitById(el.dataset.u),+el.dataset.i)},
 guide(el){modal(guideHTML(unitById(el.dataset.u)))},
 testout(el){const u=unitById(el.dataset.u);modal('<h2>Test out of '+esc(u.title)+'?</h2><p class="muted">Already know this unit? Answer its questions with no lessons first. Score 85% or better and the whole unit is marked done. It costs no hearts, and nothing happens if you miss.</p><button class="btn" data-a="testgo" data-u="'+u.id+'">Start the test</button>')},
 testgo(el){closeModal();const u=unitById(el.dataset.u);start({mode:'testout',u,hearts:false,title:'Test out',steps:cpSteps(u)})},
 tracks(){modal('<h2>Choose a level</h2>'+TRACKS.map(t=>{const us=trackUnits(t.id),d=us.filter(unitDone).length;return '<button class="trk'+(st.track===t.id?' on':'')+'" data-a="track" data-t="'+t.id+'"><div><b>'+esc(t.name)+'</b><small>'+esc(t.sub)+'</small></div><span class="chip">'+d+'/'+us.length+'</span></button>'}).join(''))},
 track(el){st.track=el.dataset.t;save();closeModal();tab='learn';lastWalk=null;render();window.scrollTo(0,0)},
 hearts(){heartsTick();const t=nextHeartIn();modal('<h2>'+st.hearts+' of '+MAXH+' hearts</h2><p class="muted">A wrong answer in a lesson or checkpoint costs one heart. Explaining in your own words and practice never do. One heart comes back every 30 minutes'+(t?' (next in '+t+')':'')+', and finishing a practice round earns one right away.</p>'+(st.hearts<MAXH?'<button class="btn" data-a="earn">Practice to earn a heart</button>':''))},
 earn(){closeModal();const had=!!S;if(had){S=null;$('#ov').classList.remove('on');document.body.style.overflow=''}const qs=learnedQs().filter(q=>q.t!=='ex');if(!qs.length){if(had)render();return toast('Finish your first lesson to unlock practice. Hearts also refill on their own.',3600)}startPractice(weakDue().length?'weak':'mix')},
 weak(){startPractice('weak')},mix(){startPractice('mix')},explain(){startPractice('explain')},
 close(){closeModal()},
 quit(){if(S&&!S.out&&!S.result&&S.i>0)return modal('<h2>Leave this '+(S.mode==='lesson'?'lesson':'round')+'?</h2><p class="muted">Your progress in it will not be saved.</p><button class="btn bad" data-a="quit2">Leave</button><button class="btn ghost" data-a="close">Keep going</button>');closeOv()},
 quit2(){closeModal();closeOv()},
 done(){closeOv();if(tab==='learn')setTimeout(()=>toCurrent(true),60)},
 next(){next()},check(){check()},
 sel(el){S.V.sel=+el.dataset.k;renderS(true)},
 tf(el){S.V.sel=el.dataset.v==='1';renderS(true)},
 pick(el){const k=el.dataset.k;S.V.sel[k]=!S.V.sel[k];renderS(true)},
 pl(el){const i=+el.dataset.i;if(S.V.link[i]!=null){delete S.V.link[i];S.V.selL=-1}else S.V.selL=S.V.selL===i?-1:i;renderS(true)},
 pr(el){const i=+el.dataset.i,V=S.V;const owner=Object.keys(V.link).find(l=>V.link[l]===i);if(owner!=null){delete V.link[owner];if(V.selL<0){renderS(true);return}}if(V.selL>=0){V.link[V.selL]=i;V.selL=-1}renderS(true)},
 si(el){const k=+el.dataset.k;S.V.sel=S.V.sel===k?-1:k;renderS(true)},
 sb(el){if(S.V.sel<0)return;S.V.place[S.V.sel]=+el.dataset.g;S.V.sel=-1;renderS(true)},
 su(el){delete S.V.place[+el.dataset.k];renderS(true)},
 ord(el){const i=+el.dataset.i,p=S.V.pick,n=p.indexOf(i);if(n>=0)p.splice(n,1);else p.push(i);renderS(true)},
 show(){S.V.shown=true;renderS(true);const b=$('#sbody');if(b)b.scrollTop=b.scrollHeight},
 rate(el){const r=+el.dataset.r,q=S.steps[S.i].q;S.rate=r;S.asked++;if(r===2){S.right++;S.first++;srsRight(q.id)}else if(r===0)addMistake(q.id);S.res=true;S.phase='fb';save();renderS(true);if(r===2)confetti(30)},
 'ob-next'(){obStep++;render();window.scrollTo(0,0)},
 'ob-track'(el){st.track=el.dataset.t;render()},
 'ob-goal'(el){st.goal=+el.dataset.g;render()},
 'ob-done'(){st.ob=true;save();render();window.scrollTo(0,0)},
 reset(){modal('<h2>Erase all progress?</h2><p class="muted">Your XP, streak and finished lessons on this device will be gone for good.</p><button class="btn bad" data-a="reset2">Erase everything</button><button class="btn ghost" data-a="close">Keep my progress</button>')},
 reset2(){const lb=st.lb,rem=st.rem;st=fresh();st.lb=lb;st.rem=rem;obStep=0;save();closeModal();tab='learn';render();window.scrollTo(0,0)},
 'lb-join'(){const n=($('#lbName').value||'').trim().slice(0,24);if(!n)return toast('Type a display name first.');st.lb.name=n;if(!st.name)st.name=n;if(!st.lb.id)st.lb.id=newId();st.lb.joined=true;save();LB.at=0;render();lbLoad()},
 'lb-mode'(el){LB.mode=el.dataset.m;render()},
 'lb-refresh'(){LB.at=0;lbLoad();render()},
 'lb-leave'(){modal('<h2>Leave the leaderboard?</h2><p class="muted">Your name and stats will be removed for everyone. Your progress on this device stays.</p><button class="btn bad" data-a="lb-leave2">Leave</button><button class="btn ghost" data-a="close">Stay</button>')},
 'lb-leave2'(){if(lbOn()&&st.lb.id){try{fetch(lbURL(st.lb.id),{method:'DELETE'}).catch(()=>{})}catch(e){}}st.lb.joined=false;save();closeModal();LB.rows=null;render()}
};
document.addEventListener('click',e=>{const m=e.target.closest('[data-tap]');if(m&&!e.target.closest('[data-a]')){Mascots.poke(m);const w=m.dataset.tap,ctx=m.dataset.ctx;const pool=LINES[w][ctx]&&Math.random()<.4?ctx:'poke';toast('<span style="display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75">'+label(w)+'</span>'+esc(say(w,pool)),3400);return}
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a],[data-tap]')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'&&$('.modal'))closeModal();
 if(e.key==='Enter'&&S&&!e.target.matches('textarea,button,input,select')){const b=$('#sroot [data-a=next],#sroot [data-a=check]:not([disabled]),#sroot [data-a=done]');if(b)b.click()}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
 if(k==='ex'){S.V.text=v;return}
 if(k==='name'){st.name=v.trim().slice(0,24);save()}
 else if(k==='lbname'){const n=v.trim().slice(0,24);if(n){st.lb.name=n;save()}}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
 if(k==='goal'){st.goal=+v;save();render()}
 else if(k==='theme'){st.theme=v;save();applyTheme()}
 else if(k==='remfreq'){if(v==='off')remDisable();else remEnable(v)}
 else if(k==='remhour'){st.rem.hour=+v;save()}});
document.addEventListener('pointermove',e=>Mascots.look(e.clientX,e.clientY),{passive:true});
document.addEventListener('pointerdown',e=>Mascots.look(e.clientX,e.clientY),{passive:true});
window.addEventListener('scroll',onScroll,{passive:true});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
setInterval(()=>{if(!st)return;const h=st.hearts;heartsTick();const c=$('#hclock');if(c)c.textContent=nextHeartIn()||'0:00';if(st.hearts!==h){save();if(S&&S.out&&!S.failed){closeOv()}else if(!S)render()}},1000);

/* ---------- new version check: reloads on open, never in the middle of a lesson ---------- */
let wantReload=false;
function pendingReload(){if(wantReload&&!S){wantReload=false;location.reload()}}
function versionCheck(){if(!window.ME_BUILD||!window.fetch||location.protocol==='file:')return;fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=(t||'').trim();if(t&&/^\d+$/.test(t)&&t!==window.ME_BUILD){if(sessionStorage.getItem('me.reloaded')===t)return;try{sessionStorage.setItem('me.reloaded',t)}catch(e){}wantReload=true;pendingReload()}}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){versionCheck();heartsTick();if(!S&&st&&st.ob)render()}});
window.addEventListener('pageshow',versionCheck);

/* ---------- boot ---------- */
load();applyTheme();heartsTick();
document.body.insertAdjacentHTML('afterbegin',SCDEFS);
render();save();remInit();versionCheck();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}

</script>
</body>
</html>
