  TF("Forcing farms into collectives in the Soviet Union went smoothly and raised food supplies right away.",false,"It was followed by a famine that killed millions. Ukrainians call it the Holodomor.")],
 ["The Soviet Union and the United States became rivals in the **Cold War** (about 1947 to 1991). In 1991 the Soviet Union broke apart, and its economy had been falling behind for years.",
  M("What happened to the Soviet Union in 1991?",["It broke apart","It won the Cold War and grew larger","It merged with China","It became a monarchy again"],"The USSR dissolved into 15 countries, including Russia and Ukraine.")]
]},
{t:'Many roads',sub:'China, Cuba and the Nordic path',items:[
 ["In China, the Communist Party led by **Mao Zedong** won a civil war in 1949. Mao's **Great Leap Forward** (1958 to 1962), a rushed plan to boost farming and steel, caused a famine that killed tens of millions.",
  M("What was the result of the Great Leap Forward?",["A deadly famine","China becoming the richest country","Free elections across China","The end of the Communist Party"],"It was one of the deadliest famines in history. Estimates range from roughly 15 million to 45 million deaths.")],
 ["After Mao died in 1976, China's leaders allowed private business and foreign trade while the Communist Party kept all political power. Hundreds of millions of people left poverty.",
  CASE("Today China has huge private companies, a stock market and billionaires. One party runs the government and no other party can win.",PICK("Which statements fit this description?",["It mixes markets with one-party rule","It is far from Marx's stateless goal"],["It has no private business at all","It is a multi-party democracy"],"Modern China combines a largely market economy with Communist Party control. Whether to call it socialist is hotly debated.")),{g:"Billionaires in the Communist Party. Marx is spinning so fast he could power a city."}],
 ["In **Cuba**, Fidel Castro's rebels took power in 1959. The government built strong health care and schools. It also banned other parties, jailed critics and has struggled with shortages, made worse by a long U.S. trade embargo.",
  SORT("Sort these facts about Cuba since 1959.",{"Pointed to by supporters":["High literacy","Many doctors per person"],"Pointed to by critics":["Only one legal party","Critics put in prison","Shortages of basic goods"]},"Both lists are accurate. People weigh them differently.")],
 ["Other socialists took a slower road. In Sweden and its neighbors, **social democratic parties** won elections again and again from the 1930s on and built welfare states without a revolution.",
  PAIR("Match each country to its path.",[["Russia, 1917","Revolution led by one party"],["China, 1949","Victory in a civil war"],["Cuba, 1959","A rebel army takes power"],["Sweden, 1930s on","Reforms won through elections"]],"Socialists have disagreed for more than a century about revolution versus reform.")],
 ["A pattern stands out: where one party took all power, there were no elections to remove leaders who made deadly mistakes. Where socialists stayed inside democracy, change was slower but could be corrected.",
  EX("Why do many people say democracy matters for judging socialist governments?","In one-party states like the Soviet Union and Mao's China, leaders could not be voted out or openly criticized, so terrible policies such as forced collectivization went on and millions died. Where socialists governed through elections, as in the Nordic countries, voters could remove them and mistakes could be fixed.")]
]}]});

U({id:'g8e',track:'g8',title:'Socialism in America',scene:'usa',blurb:'It has a longer history here than most people think.',lessons:[
{t:'Debs and the Wobblies',sub:'The early 1900s',items:[
 ["**Eugene V. Debs** was a railroad union leader from Indiana who ran for president five times for the **Socialist Party of America**. In 1912 he won about 6 percent of the vote, around 900,000 ballots.",
  DATA("Vote for president, 1912",[["Wilson (Democrat)",41.8,"41.8%"],["Roosevelt (Progressive)",27.4,"27.4%"],["Taft (Republican)",23.2,"23.2%"],["Debs (Socialist)",6.0,"6.0%"]],M("What does the chart show about Debs in 1912?",["About 1 voter in 17 chose him","He finished in second place overall","He won more votes than Taft","He was not on the ballot"],"Six percent is the best a Socialist candidate for president has ever done in the United States."))],
 ["In 1918 Debs gave a speech against the First World War. He was sentenced to ten years in prison under the Espionage Act. In 1920 he ran for president from his cell and got over 900,000 votes.",
  TF("Debs once ran for president while he was in prison.",true,"In 1920 he ran as 'Convict 9653' and won more than 900,000 votes. President Harding released him in 1921.")],
 ["The **Industrial Workers of the World** (IWW), nicknamed the **Wobblies**, formed in 1905. Most unions then took only skilled white men. The IWW welcomed everyone: unskilled workers, women, immigrants and Black workers.",
  M("What made the IWW unusual for its time?",["It welcomed workers other unions shut out","It only accepted skilled craftsmen","It was run by factory owners","It opposed all strikes"],"Its goal was 'One Big Union' of all workers.")],
 ["Around 1910 socialists also ran cities. Milwaukee elected Socialist mayors for decades. They were nicknamed **sewer socialists** because they focused on clean water, parks and honest government.",
  CASE("A mayor of Milwaukee in the 1910s spends his time building sewers, public parks and a city-owned water system, and is known for running a clean government.",M("What nickname did socialists like him earn?",["Sewer socialists","Wobblies","Bolsheviks","Utopians"],"The name began as an insult from rivals who wanted revolution, and Milwaukee's socialists wore it proudly.")),{g:"Sewer socialists. Finally, a politics I can smell."}],
 ["After the Russian Revolution came the first **Red Scare** (1919 to 1920). The government raided radical groups, jailed thousands and deported hundreds of immigrants.",
  PAIR("Match the name to the description.",[["Eugene Debs","Socialist who ran for president five times"],["Wobblies","Members of the IWW union"],["Sewer socialists","Milwaukee's practical city leaders"],["Red Scare","A wave of fear and arrests of radicals"]],"All four come from roughly 1900 to 1920, the high point of American socialism.")]
]},
{t:'New Deal to now',sub:'From the 1930s to today',items:[
 ["During the Great Depression, President Franklin Roosevelt's **New Deal** created Social Security, unemployment insurance, a minimum wage and the legal right to join a union.",
  PICK("Which of these came from the New Deal?",["Social Security","A national minimum wage","A legal right to join a union"],["Public ownership of all banks","The end of private business"],"The New Deal borrowed ideas socialists had long pushed, but it kept businesses in private hands.")],
 ["Was the New Deal socialist? Roosevelt said he was saving capitalism. The Socialist leader Norman Thomas complained that Roosevelt carried out the Socialist platform 'on a stretcher.'",
  M("How is the New Deal best described?",["Reform inside capitalism","A workers' revolution","The end of private property","A one-party state"],"It added a welfare state and labor rights to a capitalist economy. That makes it closer to social democracy than to socialism.")],
 ["A second **Red Scare** came after World War II. Senator Joseph McCarthy accused many people of being Communists, often with no proof. Thousands lost jobs in government, schools and Hollywood.",
  TF("During the 1950s Red Scare, people lost their jobs only after being proven to be spies in court.",false,"Many were fired or blacklisted on rumor alone. The word 'McCarthyism' now means making accusations without evidence. There were some real Soviet spies, but most of the accused were not.")],
 ["Socialists were part of the civil rights movement. **A. Philip Randolph**, a socialist and union leader, led the 1963 March on Washington, whose full name was the March on Washington for **Jobs and Freedom**.",
  M("Who was A. Philip Randolph?",["A socialist union leader","A senator who hunted Communists","The founder of the IWW","A president during the Depression"],"Randolph led the Brotherhood of Sleeping Car Porters, a union of Black railroad workers.")],
 ["Today the largest socialist group in the country is the **Democratic Socialists of America** (DSA). It grew from a few thousand members to tens of thousands after Bernie Sanders ran for president in 2016.",
  EX("Why do historians say the New Deal was not socialism, even though socialists had asked for many of its programs?","The New Deal created programs such as Social Security, a minimum wage and union rights, which socialists had demanded for years. But it left factories, banks and businesses in private hands. It reformed capitalism instead of replacing private ownership, which is why it is closer to social democracy.")]
]}]});

U({id:'g8f',track:'g8',title:'Sharing in practice',scene:'coop',blurb:'Unions, co-ops and public ownership: the everyday tools.',lessons:[
{t:'Unions and co-ops',sub:'Power in numbers',items:[
 ["A **labor union** is a group of workers who join together to bargain with their employer about pay, hours and safety. Bargaining as a group is called **collective bargaining**.",
  M("What is collective bargaining?",["Workers negotiating with the boss as a group","Each worker asking alone for a raise","Owners agreeing on prices together","Shoppers voting on what a store sells"],"One worker can be replaced easily. A whole workforce is much harder to ignore.")],
 ["A union's strongest tool is the **strike**: everyone stops working until a deal is reached. The agreement that ends bargaining is called a **contract**.",
  ORD("Put the steps of a union campaign in order.",["Workers talk and decide to form a union","They vote to be recognized","They bargain with the employer","Both sides sign a contract"],"A strike can happen if bargaining breaks down, but most contracts are settled without one.")],
 ["A **cooperative** (co-op) is a business owned and run by its members. Each member gets **one vote**, no matter how much money they put in.",
  CASE("At a normal company, someone with 1,000 shares gets 1,000 votes. At Green Hill Co-op, every member gets a single vote, whether they joined yesterday or twenty years ago.",M("What rule is the co-op using?",["One member, one vote","One dollar, one vote","The oldest member decides","The manager decides alone"],"One member, one vote is the core of a co-op and goes back to the Rochdale shop of 1844.")),{h:"One member, one vote. Beavers have always built that way."}],
 ["There are different kinds. In a **worker co-op** the workers own it. In a **consumer co-op** the customers own it. A **credit union** is a bank owned by the people who save there.",
  PAIR("Match the type to its owners.",[["Worker co-op","The people who work there"],["Consumer co-op","The people who shop there"],["Credit union","The people who bank there"],["Ordinary corporation","Shareholders who bought stock"]],"REI is a consumer co-op. Mondragon in Spain is a famous group of worker co-ops.")],
 ["Co-ops and unions are not the same thing as socialism, and plenty of members are not socialists. But socialists have long supported both as ways to give working people more control.",
  SORT("Union or co-op?",{"Union":["Bargains with an employer","Can call a strike","Signs a contract with management"],"Co-op":["Is owned by its members","Gives each member one vote"]},"A union bargains with an owner. In a co-op the members are the owners.")]
]},
{t:'Owned by the public',sub:'Public ownership near you',items:[
 ["**Public ownership** means a government (city, state or national) owns an enterprise on behalf of everyone. Public schools, libraries, water systems and the Postal Service are examples.",
  PICK("Which of these are usually publicly owned in the United States?",["Public libraries","City water systems","The Postal Service"],["Grocery store chains","Car companies"],"Most Americans use publicly owned services every day without calling them socialist.")],
 ["Some cities own their electric company. This is called **public power**. Seattle City Light, owned by the city since the early 1900s, is one of the biggest in the country.",
  TF("Seattle's electric utility is owned by private shareholders.",false,"Seattle City Light belongs to the city. About one in seven Americans gets electricity from a publicly owned utility.")],
 ["Supporters say public ownership puts service ahead of profit and keeps prices fair. Critics say public agencies can be slow, wasteful or run for political reasons because they face no competition.",
  SORT("Who makes this argument about public ownership?",{"Supporters":["No profit is taken out","Voters can hold it accountable","Everyone is served, even where it loses money"],"Critics":["Little pressure to cut waste","Politics can drive decisions"]},"Both sides have real examples to point to. It often depends on how well the agency is run.")],
 ["When socialists run a city and focus on services like buses, housing and utilities, it is called **municipal socialism**. Milwaukee's sewer socialists are the classic American case.",
  M("What is municipal socialism?",["Socialists running a city's services","A plan to end all city governments","A national revolution led by one party","A company owned by a single family"],"'Municipal' means having to do with a city or town.")],
 ["So there are three main tools: **unions** bargain with owners, **co-ops** make the members the owners, and **public ownership** makes everyone the owner through government.",
  EX("Pick one: a union, a co-op or public ownership. Explain in your own words how it gives ordinary people more say.","A union lets workers bargain together, so the employer has to listen about pay and safety. A co-op is owned by its members, who each get one vote on how it is run. Public ownership puts an enterprise under a government that voters elect, so it answers to the public instead of to private owners.")]
]}]});

/* ===== High school: how the systems work and where they split ===== */
U({id:'hsa',track:'hs',title:'Systems side by side',scene:'city',blurb:'Two questions sort every economy: who owns, and who decides.',lessons:[
{t:'Two dials',sub:'Ownership and coordination',items:[
 ["Think of every economy as having two dials. The **ownership** dial runs from private to social. The **coordination** dial runs from markets to central planning. They can be set separately.",
  PAIR("Match each mix to an example.",[["Private ownership + markets","The United States today"],["State ownership + central plan","The Soviet Union in 1950"],["Worker ownership + markets","Yugoslavia's self-managed firms"],["Private ownership + heavy planning","U.S. war production in 1943"]],"Ownership and coordination are separate dials, so four mixes are possible.")],
 ["In a market, **prices** carry information. A rising price tells producers to make more and buyers to use less, without anyone giving an order.",
  ORD("A frost ruins part of the orange crop. Put what happens next in order.",["Fewer oranges reach the market","The price of oranges rises","Shoppers buy fewer oranges","Growers elsewhere plant more trees"],"No central office planned this. The price change passed the news along.")],
 ["In a **centrally planned economy**, a state office sets targets: how much steel, how many shoes, at what price. The Soviet planning office was called **Gosplan**.",
  CASE("A Soviet nail factory is told to produce as many tons of nails as possible. It makes a small number of huge, heavy nails that nobody can use.",M("What problem with central planning does this old joke point to?",["Targets can be met without meeting real needs","Factories had too many customers to keep up with","Prices changed too quickly","Workers owned too much stock"],"When success is measured by one number, managers aim at the number. Soviet newspapers themselves printed cartoons about it.")),{g:"One giant nail. Technically a plan fulfilled. Technically I am a penguin."}],
 ["Markets have their own failures. They can leave people without what they need if they cannot pay, ignore costs dumped on others (like pollution), and swing between boom and bust.",
  SORT("Which system is this criticism usually aimed at?",{"Markets":["Pollution is left out of the price","People who can't pay go without","Booms followed by mass layoffs"],"Central planning":["Shortages and long lines","Planners lack local knowledge","Little reason to improve products"]},"Each way of coordinating has typical weak spots. Most real economies mix them.")],
 ["Almost every country today is a **mixed economy**: mostly private firms and markets, with public schools, some public companies, and rules and taxes set by government.",
  TF("Most real countries are purely capitalist or purely socialist.",false,"Nearly all are mixes. The arguments are about where to set each dial.")],
 ["**Market socialism** is the idea of socially owned firms (often worker co-ops) that still compete in markets. It tries to keep price signals while changing who owns.",
  M("What does market socialism combine?",["Social ownership with market competition","Private ownership with a detailed central plan","One-party rule with free trade","Welfare programs with private firms"],"The firms are owned by workers or the public, but they buy and sell at market prices.")]
]},
{t:'Who gets what',sub:'Wages, profit and inequality',items:[
 ["A firm's income is split. Some pays for materials and tools. Some goes to workers as **wages**. What is left is **profit**, which goes to the owners.",
  CASE("A cafe takes in $10,000 in a week. It spends $4,000 on supplies and rent and $4,500 on wages.",M("How much profit is left for the owner?",["$1,500","$4,500","$5,500","$6,000"],"$10,000 minus $4,000 minus $4,500 leaves $1,500."))],
 ["Defenders of capitalism say profit rewards owners for **taking risks** and putting money in, and that the hunt for profit pushes firms to invent and cut costs.",
  SORT("Who would make this point about profit?",{"Defenders of capitalism":["Profit rewards risk","Profit drives invention","Losses weed out bad ideas"],"Socialist critics":["Profit comes from workers' labor","Owners get paid without working"]},"Both sides agree profit exists. They disagree about whether owners earn it.")],
 ["Socialists answer that workers create the value and owners collect part of it only because they own the workplace. They also note that most great fortunes are inherited or grow from owning, not from wages.",
  DATA("Share of all U.S. income going to the top 1%",[["1928",23.9,"23.9%"],["1976",8.9,"8.9%"],["2007",23.5,"23.5%"]],M("What does the chart show?",["Inequality fell, then rose again","Inequality has fallen steadily the whole time","The top 1% share never changed","The top 1% earned less than 5%"],"The top share dropped sharply in the mid-1900s, the era of strong unions and high top tax rates, and climbed back by 2007."),"Source: Piketty and Saez, income including capital gains")],
 ["**Inequality** is the gap between rich and poor. The **Gini index** measures it from 0 (everyone equal) to 1 (one person has everything).",
  M("A country's Gini index falls from 0.45 to 0.30. What happened?",["Incomes became more equal","Incomes became less equal","Everyone got poorer","The population shrank"],"A lower Gini means income is spread more evenly.")],
 ["Equality of **opportunity** means everyone gets a fair start. Equality of **outcome** means people end up with similar amounts. Liberals stress the first. Socialists care more about the second, and say a fair start is impossible when outcomes are far apart.",
  SORT("Opportunity or outcome?",{"Equal opportunity":["Free public schools for all","Banning job discrimination"],"More equal outcomes":["A cap on the pay gap in a firm","High taxes on very large fortunes","Profit shared equally among workers"]},"Many policies do some of both, but the goals are different.")],
 ["Every system faces a trade-off between rewarding effort and sharing fairly. Where to strike that balance is a values question as much as an economics one.",
  EX("Give the strongest argument for profit and the strongest argument against it, in your own words.","For: owners risk their money, and the chance of profit pushes firms to invent, cut waste and serve customers, while losses shut down bad ideas. Against: the workers actually produce what is sold, and owners can collect income simply because they own the workplace, which lets wealth pile up with people who already have it.")]
]}]});

U({id:'hsb',track:'hs',title:"Marx's toolkit",scene:'books',blurb:'Class, surplus and the theory that history has a direction.',lessons:[
{t:'Class and surplus',sub:'Where Marx says profit comes from',items:[
 ["For Marx, **class** is about your relationship to the means of production. Capitalists own them. Workers own only their ability to work, which Marx called **labor power**, and must sell it.",
  CASE("A surgeon earns $400,000 a year working for a hospital chain. A man who owns a small machine shop with eight employees takes home $90,000.",M("In Marx's terms, which one is the capitalist?",["The shop owner","The surgeon","Both of them","Neither of them"],"Marx's classes are about owning versus working for wages, not about income. Critics say this shows the two-class picture is too simple.")),{h:"It surprises people that the richer one counts as the worker."}],
 ["Marx argued a worker produces more value in a day than the wage costs. The extra is **surplus value**, and it is where profit comes from.",
  CASE("A worker is paid $120 for an eight-hour day. In those eight hours she adds $300 of value to the products she makes.",M("How much surplus value does Marx say the owner gets?",["$180","$120","$300","$420"],"$300 of new value minus the $120 wage leaves $180."))],
 ["Marx called this **exploitation**. He meant it as a technical term: workers are paid less than the value they add. He was not saying every boss is cruel.",
  TF("When Marx says workers are exploited, he mainly means their bosses are unkind people.",false,"For Marx exploitation is built into the wage system, however kind the individual employer is.")],
 ["Mainstream economists reject this. They say value comes from what buyers will pay, not from labor hours, and that owners contribute capital, risk and organization.",
  SORT("Marx, or his critics in mainstream economics?",{"Marx":["Labor is the source of new value","Profit is unpaid labor"],"Mainstream critics":["Value depends on what buyers want","Owners are paid for risk and waiting","Machines and ideas add value too"]},"This is one of the deepest splits in economics.")],
 ["Marx also wrote about **alienation**: factory workers have no say over what they make or how, so work feels like something done to them instead of by them.",
  SRC("Capital is dead labour, that, vampire-like, only lives by sucking living labour, and lives the more, the more labour it sucks.","Karl Marx, Capital, Volume 1, 1867",M("What is Marx claiming with this image?",["Capital grows by taking in workers' labor","Machines will soon replace every human worker","Factory work is good for workers' health","Owners work harder than employees"],"'Dead labour' means machines and money made by past work. Marx says they only grow by absorbing living workers' effort."))],
 ["Marx expected competition to squeeze small owners into the working class, leaving two great camps. Instead a large **middle class** of managers and professionals grew.",
  PICK("Which later developments did Marx's two-class forecast miss?",["A large salaried middle class","Workers owning stock through pensions","Rising real wages in rich countries"],["Recurring economic crises","Giant corporations"],"Crises and giant firms fit his forecasts. Rising wages and a big middle class did not.")]
]},
{t:'History has stages',sub:'Historical materialism',items:[
 ["**Historical materialism** is Marx's theory that the way a society produces things shapes its laws, politics and ideas, more than the other way around.",
  SRC("It is not the consciousness of men that determines their existence, but their social existence that determines their consciousness.","Karl Marx, Preface to A Contribution to the Critique of Political Economy, 1859",M("What does Marx mean?",["How people live and work shapes how they think","Great ideas are the thing that changes the economy","People are born with fixed beliefs","Religion is the base of every society"],"Marx turned the usual view upside down: material life comes first, ideas follow."))],
 ["He called the economy the **base** and the laws, government, religion and culture built on it the **superstructure**.",
  SORT("Base or superstructure?",{"Base":["Factories and farms","Who owns the land","How work is organized"],"Superstructure":["The court system","Religion","School lessons"]},"For Marx the superstructure tends to protect whatever arrangement exists in the base.")],
 ["Marx saw history moving through stages, each with its own ruling class and each undone by its own conflicts.",
  ORD("Put Marx's stages in order.",["Slave societies","Feudalism","Capitalism","Socialism","Communism"],"Each stage, in his view, grows inside the one before it.")],
 ["Marx admired what capitalism had achieved. He thought it had created more wealth than all earlier ages together, and that this wealth is what makes socialism possible.",
  TF("Marx thought capitalism had achieved nothing worthwhile.",false,"The Manifesto praises capitalism's 'colossal productive forces.' Marx thought it was a necessary stage that would be outgrown.")],
 ["The best-known objection is from the philosopher **Karl Popper**: a theory that can explain any outcome after the fact, and keeps moving its predictions, cannot really be tested.",
  M("What was Popper's criticism of Marxism?",["It cannot be proven wrong","It ignores factory workers","It was written too quickly","It praises capitalism too much"],"Popper said a scientific theory must risk being shown false. He thought Marx's followers kept rescuing the theory whenever a prediction failed.")],
 ["Marx was not only describing the world. He wanted to change it.",
  SRC("The philosophers have only interpreted the world, in various ways; the point is to change it.","Karl Marx, Theses on Feuerbach, 1845",EX("Explain in your own words what historical materialism claims, and give one criticism of it.","Historical materialism says the way a society makes its living (its technology and who owns what) shapes its politics, laws and ideas, and that conflicts inside each economic system push history on to the next stage. A common criticism is that ideas, religion and individual leaders also change history, and that the theory is so flexible it can be stretched to fit anything."))]
]}]});

U({id:'hsc',track:'hs',title:'Splits in the movement',scene:'peaks',blurb:'Reform or revolution? State or no state? Socialists have never agreed.',lessons:[
{t:'Reform or revolution',sub:'The great split',items:[
 ["Socialist parties linked up across borders in groups called **Internationals**. The First (1864) included Marx and the anarchists. The Second (1889) joined mass parties like Germany's SPD. The Third (1919), the Comintern, was run from Moscow.",
  ORD("Put the Internationals in order.",["First International, with Marx and Bakunin","Second International of mass parties","Third International, led from Moscow"],"1864, 1889 and 1919.")],
 ["By 1900 German workers had the vote, unions and rising pay. **Eduard Bernstein** argued that Marx's forecast of collapse was wrong and socialists should win gradual reforms through parliament. This was called **revisionism**.",
  SRC("The final goal, whatever it may be, is nothing to me; the movement is everything.","Eduard Bernstein, 1898",M("What is Bernstein saying?",["Steady reforms matter more than a far-off revolution","Workers should stop joining unions and parties altogether","Revolution must come within the year","Socialists should give up politics"],"Bernstein thought socialism would arrive as a long series of reforms."))],
 ["**Rosa Luxemburg** answered in *Reform or Revolution* (1900). She said reforms are worth fighting for, but they cannot end capitalism by themselves. Only workers taking power could.",
  PAIR("Match the person to the position.",[["Bernstein","Reform through parliament, step by step"],["Luxemburg","Reforms help, but revolution is needed"],["Lenin","A disciplined party must lead a revolution"],["Bakunin","Abolish the state right away"]],"These four positions still mark out the map of the left.")],
 ["In 1914 most socialist parties backed their own governments in the First World War, even though they had sworn workers of all countries would not shoot each other. The Second International fell apart.",
  M("Why did the Second International collapse in 1914?",["Its parties backed their own countries' war","Its leaders were all arrested on the same day in Paris","It ran out of money","Marx dissolved it"],"National loyalty proved stronger than class solidarity. Marx had died in 1883.")],
 ["After 1917 the split became permanent. **Communist** parties followed Moscow and Lenin's model. **Social democratic** parties stayed with elections and reform.",
  SORT("After 1917, which camp?",{"Communist parties":["Joined the Comintern","Took the Bolsheviks as the model"],"Social democratic parties":["Stayed with elections and parliaments","Governed Sweden for decades","Rejected one-party rule"]},"The two camps often hated each other more than they hated conservatives.")],
 ["Luxemburg supported the Russian Revolution but warned from prison in 1918 that silencing opponents would kill it.",
  SRC("Freedom is always and exclusively freedom for the one who thinks differently.","Rosa Luxemburg, The Russian Revolution, 1918",EX("What was Luxemburg's warning to the Bolsheviks, in your own words?","She argued that a revolution which bans other parties, censors the press and ends free elections will rot from within. Freedom only means something if it protects people who disagree with those in power. Without open debate, a small group of leaders ends up ruling in the workers' name."))]
]},
{t:'Party, state and their enemies',sub:'Lenin and the anarchists',items:[
 ["**Lenin** argued that workers, left to themselves, would only fight for better pay, not revolution. They needed a **vanguard party**: a tight, disciplined group of full-time revolutionaries to lead them.",
  M("What is a vanguard party?",["A disciplined group that leads the workers","A loose party open to every voter in the country","A union of skilled craftsmen","A club for factory owners"],"Critics, including other Marxists, warned that such a party would end up ruling over workers instead of for them.")],
 ["Marx had used the phrase **dictatorship of the proletariat** for the period after a revolution, when the working-class majority would hold state power. Under Lenin it came to mean rule by one party.",
  TF("When Marx wrote 'dictatorship of the proletariat,' he clearly meant rule by a single political party.",false,"Marx meant rule by the working class as a whole and pointed to the elected Paris Commune as an example. The one-party meaning came later.")],
 ["**Anarchists** such as **Mikhail Bakunin** and **Peter Kropotkin** are socialists who want no state at all. They want workplaces and communities run from below by free agreement.",
  SORT("Marxist or anarchist view?",{"Marxists (after Marx)":["Workers must take over the state first","The state fades away later"],"Anarchists":["Abolish the state immediately","Any new state creates new rulers","Organize from the bottom up"]},"Both wanted a stateless, classless society in the end. They disagreed about how to get there.")],
 ["Bakunin fought Marx inside the First International and predicted that a 'workers' state' would become a dictatorship of a new elite.",
  SRC("Liberty without socialism is privilege and injustice; socialism without liberty is slavery and brutality.","Mikhail Bakunin, 1867",M("What does Bakunin insist on?",["Socialism and freedom must go together","Freedom always matters more than equality does","A strong state protects liberty","Socialism should wait a century"],"Many people think the history of the Soviet Union proved his warning right."))],
 ["**Leon Trotsky** led the Red Army, then lost the power struggle to Stalin. He argued that revolution had to spread worldwide (**permanent revolution**), while Stalin called for **socialism in one country**.",
  PAIR("Match the idea to the person.",[["Socialism in one country","Stalin"],["Permanent revolution","Trotsky"],["Vanguard party","Lenin"],["Mutual aid","Kropotkin"]],"Trotsky was exiled in 1929 and murdered by a Soviet agent in Mexico in 1940.")],
 ["So by the 1920s there were at least four socialisms: social democrats, Communists, Trotskyists and anarchists. Their arguments were about democracy and the state as much as economics.",
  CASE("After a revolution, a new government bans all other parties 'temporarily, to protect the workers.' Ten years later the ban is still in place.",PICK("Who had warned that this would happen?",["Bakunin","Luxemburg"],["Stalin","Gosplan"],"Both an anarchist and a Marxist predicted that emergency rule by one party would become permanent."))]
]}]});

U({id:'hsd',track:'hs',title:'The Soviet century',scene:'mill',blurb:'From 1917 to 1991: the biggest experiment and what it cost.',lessons:[
{t:'Revolution to Stalin',sub:'1917 to 1953',items:[
 ["The **Paris Commune** of 1871 was the first time workers ran a major city. It lasted 72 days before the French army crushed it, killing thousands. Marx and Lenin both studied it closely.",
  M("What was the Paris Commune?",["A workers' government that ran Paris in 1871","A French political party founded by Marx and Engels","A treaty that ended a war","A factory owned by its workers"],"Its officials were elected, could be recalled and were paid a worker's wage.")],
 ["Russia had two revolutions in 1917. In February the tsar fell and a provisional government took over. In October the Bolsheviks seized power with the slogan 'Peace, Land, Bread.'",
  ORD("Put these in order.",["The February Revolution topples the tsar","The Bolsheviks seize power in October","Civil war between Reds and Whites","Lenin's New Economic Policy begins"],"The civil war ran from 1918 to about 1921, and the New Economic Policy began in 1921.")],
 ["During the civil war the Bolsheviks seized grain by force and banned other parties. In 1921 sailors at **Kronstadt**, once heroes of the revolution, rebelled demanding free elections to the workers' councils (soviets). The Red Army crushed them.",
  TF("The Kronstadt rebels of 1921 wanted to bring back the tsar.",false,"They called for freely elected soviets and free speech for socialist and anarchist parties. Their defeat showed opposition from the left would not be allowed either.")],
 ["Lenin then retreated with the **New Economic Policy** (NEP): peasants could sell grain and small private businesses returned, while the state kept big industry.",
  M("What did the New Economic Policy allow?",["Small private trade and farming","Free multi-party elections","Foreign ownership of all industry","The return of the nobles' estates"],"Lenin called it a strategic retreat. Stalin ended it in 1928.")],
 ["Stalin replaced NEP with **Five-Year Plans** for crash industrialization and forced peasants onto **collective farms**. Industry grew enormously. The countryside was devastated and millions died in the famine of 1932 to 1933.",
  SORT("Stalin's policies: sort the results.",{"What the state gained":["Huge new steel and tractor plants","An arms industry that beat Hitler"],"What people paid":["Famine deaths in the millions","Farmers deported as 'kulaks'","Workers forbidden to quit jobs"]},"Historians still argue over whether industrialization could have been done at a lower human cost. Most think it could.")],
 ["In the **Great Terror** of 1937 to 1938, about 700,000 people were shot after secret trials or none. Over the Stalin years roughly 18 million people passed through the **Gulag** labor camps.",
  DATA("People held in Gulag camps and colonies on January 1",[["1930",0.18,"0.18 million"],["1935",0.97,"0.97 million"],["1940",1.66,"1.66 million"],["1950",2.56,"2.56 million"]],M("What does this chart show?",["The camp population grew for two decades","The camps were closed down during the 1930s","Most prisoners were held in 1930","The camps shrank under Stalin"],"The numbers come from the Soviet state's own archives, opened after 1991."),"Source: Soviet archival data")]
]},
{t:'Cold War to collapse',sub:'1945 to 1991',items:[
 ["After 1945 the Soviet army stayed in Eastern Europe and Communist governments were installed from Poland to Bulgaria. The standoff with the U.S.-led West was the **Cold War**.",
  PICK("Which countries had Soviet-backed Communist governments after 1945?",["Poland","East Germany","Hungary"],["Sweden","France"],"Sweden and France stayed multi-party democracies, though France had a large Communist Party.")],
 ["In 1956 the new leader **Nikita Khrushchev** gave a 'secret speech' denouncing Stalin's crimes. Months later, when Hungarians rose up for independence, Soviet tanks crushed them.",
  M("What did Khrushchev's 1956 speech do?",["It condemned Stalin's terror","It announced the end of the Cold War","It handed power to parliament","It praised Hungary's uprising"],"The speech shocked Communists worldwide. Many quit their parties that year, after Hungary.")],
 ["In 1968 Czechoslovakia tried 'socialism with a human face': free press, less central control. This **Prague Spring** ended when Soviet-led armies invaded.",
  PAIR("Match the year to the event.",[["1956","Soviet tanks crush the Hungarian uprising"],["1961","The Berlin Wall goes up"],["1968","The Prague Spring is ended by invasion"],["1989","The Berlin Wall comes down"]],"Each crackdown cost the Soviet model more supporters abroad.")],
 ["The planned economy was good at building steel mills and rockets and poor at everyday goods. By the 1970s growth had slowed, shops had shortages, and a black market filled the gaps.",
  CASE("In 1985 a Soviet family has savings in the bank and steady jobs. The shop has no shoes in the right size, and the wait for a car is eight years.",M("What does this show about the late Soviet economy?",["Money was not the problem; goods were scarce","Wages were too low for anyone to buy anything","Unemployment was very high","Prices were rising too fast"],"With prices fixed low and output set by plan, people had cash but faced empty shelves and queues.")),{g:"Eight years for a car. I'd have walked. I'd have flown, actually."}],
 ["**Mikhail Gorbachev** tried to save the system after 1985 with **glasnost** (openness) and **perestroika** (restructuring). Open debate released anger the system could not survive.",
  ORD("Put the end of the Soviet bloc in order.",["Gorbachev becomes leader","Glasnost allows open criticism","Eastern Europe's regimes fall","The Soviet Union dissolves"],"1985, the later 1980s, 1989 and December 1991.")],
 ["Why did it fall? Explanations include economic stagnation, the cost of the arms race, national movements in the republics, and the fact that people no longer believed in it.",
  EX("In your own words, why is the Soviet record so hard to sum up in one sentence?","Because it holds real achievements and enormous crimes at once. The USSR turned a poor farming country into an industrial power, spread schooling and health care, and did much of the fighting that beat Nazi Germany. It also starved, shot and imprisoned millions of its own people and allowed no political freedom, and in the end its economy could not deliver ordinary goods.")]
]}]});

U({id:'hse',track:'hs',title:'Other roads',scene:'world',blurb:'China, Cuba, Yugoslavia, the Nordics and the newly free nations.',lessons:[
{t:'Revolutions outside Europe',sub:'China, Cuba and decolonization',items:[
 ["Marx expected factory workers to make the revolution. **Mao Zedong** built his on China's peasants, fighting a long guerrilla war from the countryside before winning in 1949.",
  M("How did Mao change the Marxist script?",["He based the revolution on peasants","He rejected a role for any political party","He relied on votes in parliament","He waited for Europe to go first"],"China had few factory workers, so Mao turned to the rural majority.")],
 ["Mao's China redistributed land, raised literacy and life expectancy, and gave women new legal rights. It also brought the Great Leap famine and the **Cultural Revolution** (1966 to 1976), when students were urged to attack teachers, officials and 'old' culture.",
  SORT("Sort these parts of the Mao era.",{"Gains":["Life expectancy rose sharply","Literacy spread","Land was given to poor peasants"],"Disasters":["The Great Leap famine","Persecution in the Cultural Revolution"]},"Life expectancy rose from about 40 around 1950 to about 65 by the late 1970s, even counting the famine years.")],
 ["After Mao, **Deng Xiaoping** opened China to markets and foreign investment from 1978 while keeping one-party rule.",
  SRC("It doesn't matter whether a cat is black or white, as long as it catches mice.","Deng Xiaoping, 1962",M("What did Deng mean?",["Use whatever economic method works","Animals should be protected","Only state ownership is acceptable","China should copy the Soviet plan"],"Deng cared about results over doctrine. Under his reforms China became a mostly market economy run by a Communist Party."))],
 ["In **Cuba**, the 1959 revolution took over U.S.-owned businesses and allied with the Soviet Union. A 1961 literacy campaign cut illiteracy from about 23 percent to about 4 percent in one year.",
  DATA("Cubans unable to read and write",[["Before the 1961 campaign",23,"about 23%"],["After the campaign",4,"about 4%"]],TF("According to the chart, Cuba's literacy campaign had little effect.",false,"Illiteracy fell by more than four-fifths. Critics add that the same government allowed only one party and censored what people could read."),"Source: UNESCO report on the 1961 campaign")],
 ["As European empires broke up after 1945, many new nations tried their own socialisms. India under Nehru used five-year plans inside a democracy. Tanzania's Julius Nyerere pushed village farming collectives called **ujamaa**.",
  PAIR("Match the leader to the country.",[["Jawaharlal Nehru","India"],["Julius Nyerere","Tanzania"],["Fidel Castro","Cuba"],["Salvador Allende","Chile"]],"Allende was elected in 1970 and overthrown in a military coup in 1973.")],
 ["Results varied. Nyerere's Tanzania gained schools and national unity, but forcing farmers into villages hurt food production, and he later admitted the economic policy had failed.",
  CASE("A newly independent country in 1965 has few factories, most people farm, and its leader says: 'Capitalism is what the colonizers brought. We will build socialism our own way.'",M("Why did socialism appeal to many such leaders?",["Capitalism was tied to colonial rule","They wanted to rejoin a European empire","Marx had lived in their countries","Their economies were already rich"],"The empires that had ruled them were capitalist powers, and the Soviet Union offered aid and a model of fast industrial growth."))]
]},
{t:'Third ways',sub:'Yugoslavia and the Nordic model',items:[
 ["**Yugoslavia** under Tito broke with Stalin in 1948 and built something different: factories were run by councils elected by their workers and sold their products in markets. This was **workers' self-management**.",
  M("What made Yugoslav socialism different from the Soviet kind?",["Workers' councils ran the firms","There was no Communist party at all","Farms were owned by nobles","It joined the U.S. alliance"],"It was still a one-party state, but with far more room for markets, travel and debate.")],
 ["Self-management gave workers real say and decades of growth. It also had problems: firms preferred raising pay to hiring, regions grew unequal, and the country ran up heavy foreign debt before breaking apart in war in the 1990s.",
  SORT("Sort these facts about Yugoslavia.",{"Strengths":["Workers elected firm councils","Citizens could travel abroad"],"Weaknesses":["High unemployment","Rich and poor regions drifted apart","Heavy foreign debt"]},"Historians mostly blame the breakup on nationalism and debt, not on self-management alone.")],
 ["The **Nordic model** was built by social democratic parties and unions. Firms stay private, but unions and employers bargain wages for whole industries, and high taxes fund universal services.",
  PICK("Which are parts of the Nordic model?",["Industry-wide wage bargaining","Tax-funded universal services","Mostly private companies"],["A single legal party","A central plan for output"],"It is a form of capitalism, reshaped by a strong labor movement.")],
 ["Sweden's unions once tried to go further. The **Meidner Plan** of 1976 would have moved company shares, a little each year, into funds owned by workers. Business fought it hard and only a weak version passed.",
  CASE("Under a plan, every large company must issue new shares each year to a fund controlled by its workers' unions. After some decades the funds would own most of each company.",M("Why did Swedish business owners oppose the Meidner Plan so strongly?",["It would slowly end private ownership","It would sharply lower workers' wages","It would abolish labor unions","It would cancel all taxes"],"This was the point where Swedish social democracy brushed up against actual socialism, and pulled back.")),{h:"This is the line between softening capitalism and replacing it."}],
 ["Since the 1990s Nordic countries have cut some taxes and privatized some services, but they remain among the most equal and prosperous places on Earth.",
  TF("The Nordic countries abolished private business to pay for their welfare states.",false,"They kept private firms and markets and taxed the income those firms generate.")],
 ["Comparing roads: one-party revolutions changed ownership fast and at great human cost. The Nordic road changed less about ownership but kept democracy and delivered high living standards.",
  EX("Compare Yugoslav self-management with the Nordic model. Who owned the firms, and who had a say?","In Yugoslavia firms were socially owned and run by councils that workers elected, inside a one-party state. In the Nordic model firms stay privately owned, but workers have a say through powerful unions that bargain for whole industries, and voters fund generous public services through taxes in a multi-party democracy.")]
]}]});

U({id:'hsf',track:'hs',title:'The American left',scene:'usa',blurb:'Why the U.S. never got a big socialist party, and what it got instead.',lessons:[
{t:'Rise and repression',sub:'1900 to 1950',items:[
 ["At its peak in 1912 the Socialist Party had about 118,000 members, more than 1,000 elected officials and two members of Congress over the decade, including **Victor Berger** of Milwaukee.",
  M("Around what year did the Socialist Party of America peak?",["1912","1865","1948","1980"],"That year Debs won 6 percent for president and socialists held office in hundreds of towns.")],
 ["The IWW's founding document drew the line sharply.",
  SRC("The working class and the employing class have nothing in common.","Preamble to the IWW Constitution, 1905",M("What view of society does this express?",["Workers and owners have opposed interests","Workers and owners should be equal partners","Unions should stay out of politics","Only skilled workers deserve unions"],"The mainstream American Federation of Labor disagreed and aimed for 'a fair day's wage' within the system."))],
 ["Debs was jailed for an antiwar speech in 1918. At his sentencing he told the court where he stood.",
  SRC("While there is a lower class, I am in it, and while there is a criminal element, I am of it, and while there is a soul in prison, I am not free.","Eugene V. Debs, statement to the court, 1918",TF("In this statement, Debs is asking the judge for mercy by distancing himself from poor people and prisoners.",false,"He does the opposite: he identifies himself with the people at the bottom."))],
 ["Why no mass socialist party here? Historians point to several things: winner-take-all elections that punish third parties, deep racial and ethnic divisions among workers, higher wages than Europe, and repeated government repression.",
  PICK("Which reasons do historians give for the weakness of American socialism?",["Winner-take-all elections","Racial and ethnic divisions","Government repression"],["Americans were not allowed to vote","There were no factories"],"The question even has a name, from a 1906 book: 'Why is there no socialism in the United States?'")],
 ["The 1930s revived the left. A new union federation, the **CIO**, organized whole industries like autos and steel. In the **Flint sit-down strike** of 1936 to 1937, autoworkers occupied General Motors plants until GM recognized their union.",
  ORD("Put these in order.",["The stock market crashes","The Wagner Act protects union rights","Flint autoworkers occupy GM plants","Taft-Hartley limits union power"],"1929, 1935, 1936 to 1937, and 1947.")],
 ["The **Wagner Act** (1935) guaranteed the right to organize. The **Taft-Hartley Act** (1947) pulled back: it banned some kinds of strikes, let states pass 'right-to-work' laws and required union officers to swear they were not Communists.",
  SORT("Which law?",{"Wagner Act, 1935":["Guaranteed the right to form unions","Created the labor board that runs union votes"],"Taft-Hartley Act, 1947":["Allowed state 'right-to-work' laws","Banned sympathy strikes","Required anti-Communist oaths"]},"Unions call Taft-Hartley the start of their long decline. Supporters say it restored balance.")]
]},
{t:'Civil rights to today',sub:'1950 to now',items:[
 ["In the second Red Scare, the government jailed Communist Party leaders under the Smith Act and thousands lost jobs. Soviet spying was real, but the hunt swept up many people who had done nothing illegal.",
  TF("Historians now agree there were no Soviet spies in the United States during the 1940s.",false,"Decoded Soviet cables confirmed some real spies. They also show that most people accused in the Red Scare were not spies.")],
 ["Many civil rights leaders were socialists: **A. Philip Randolph**, **Bayard Rustin** (who organized the 1963 March on Washington) and **Ella Baker**. They argued racial justice needed jobs, housing and union rights.",
  SRC("Call it democracy, or call it democratic socialism, but there must be a better distribution of wealth within this country for all God's children.","Martin Luther King Jr., speech to the Negro American Labor Council, 1965",M("What is King calling for here?",["A fairer sharing of wealth","An end to all labor unions","A one-party government","Lower taxes on business"],"King rarely used the word socialism in public, but he pressed for economic change, and he was killed while supporting a sanitation workers' strike in Memphis."))],
 ["In the 1960s a student **New Left** grew around civil rights and opposition to the Vietnam War. It distrusted both corporations and the Soviet Union and talked about 'participatory democracy.'",
  M("What set the New Left apart from older Communists?",["It rejected the Soviet model","It opposed civil rights","It backed the Vietnam War","It was led by union officials"],"Its founding Port Huron Statement of 1962 called for ordinary people to share in the decisions that shape their lives.")],
 ["Union membership has fallen for decades, from about a third of workers in the 1950s to about a tenth today.",
  DATA("Share of U.S. workers who belong to a union",[["1954",34.8,"34.8%"],["1983",20.1,"20.1%"],["2000",13.4,"13.4%"],["2023",10.0,"10.0%"]],M("About how much did the union share fall between 1954 and 2023?",["By more than two-thirds","By about one-tenth","By about one-third","It did not fall"],"From roughly 35 percent to 10 percent. Causes argued over include factory job losses, employer resistance and weaker labor law."),"Source: U.S. Bureau of Labor Statistics and historical estimates")],
 ["**Democratic Socialists of America** (DSA) formed in 1982 and stayed tiny until Bernie Sanders ran in 2016. Members and allies have since won seats in Congress, statehouses and city halls.",
  DATA("DSA membership",[["2015",6,"about 6,000"],["2018",55,"about 55,000"],["2021",95,"about 95,000"]],M("What happened to DSA between 2015 and 2021?",["It grew more than tenfold","It lost most of its members","It stayed about the same","It merged with a union"],"It is still small next to the two major parties, which have tens of millions of registered voters each."),"Source: DSA membership figures as reported in the press")],
 ["DSA is not a party with its own ballot line. Its candidates mostly run in Democratic primaries, a strategy members argue about constantly.",
  EX("In your own words, give two reasons a large socialist party never took hold in the United States.","Good answers include: the winner-take-all election system makes votes for third parties feel wasted; workers were divided by race, language and religion, which made class unity hard; American wages were higher than in Europe; and the government repeatedly repressed radicals, in the Red Scares of 1919 and the 1950s.")]
]}]});

U({id:'hsg',track:'hs',title:'Tools of practice',scene:'coop',blurb:'How unions, co-ops and public enterprises actually work.',lessons:[
{t:'How a union works',sub:'From sign-up to contract',items:[
 ["To form a union in the U.S., workers usually sign cards showing interest. If at least 30 percent sign, the **National Labor Relations Board** (NLRB) holds a secret-ballot election. A majority of votes wins.",
  ORD("Put the steps in order.",["Workers sign union cards","The labor board schedules a vote","A majority votes yes","Bargaining for a first contract begins"],"Winning the vote is only the halfway point. Many new unions wait a year or more for a first contract.")],
 ["A contract usually covers pay scales, hours, safety rules and a **grievance procedure**: a set process for a worker to challenge unfair treatment.",
  CASE("Maya is fired the day after she complains about a broken safety guard. Her workplace has a union contract.",M("What can Maya use that a non-union worker usually cannot?",["A grievance procedure","A stock option","A sympathy strike","A right-to-work state law"],"The union can file a grievance and take the case to a neutral arbitrator. Most non-union U.S. workers can be fired for almost any reason."))],
 ["In a **right-to-work** state, workers covered by a union contract cannot be required to pay union fees. Supporters call that free choice. Unions call it free-riding, since they must still represent everyone.",
  SORT("Who makes each argument about right-to-work laws?",{"Supporters":["No one should be forced to pay a union","It attracts employers to the state"],"Unions":["Non-payers still get the contract's benefits","It drains money needed for bargaining","Wages are lower in those states"]},"About half the states have such laws.")],
 ["In much of Europe unions bargain for a whole industry at once (**sectoral bargaining**), so the deal covers workers even at firms with no union members.",
  DATA("Workers covered by a union-negotiated agreement (about 2019)",[["France",98,"98%"],["Sweden",88,"88%"],["Germany",54,"54%"],["United States",12,"12%"]],M("What explains France's high number despite few union members?",["Industry deals are extended to all firms","Every French worker is required to join a union","France has no private companies","French unions never strike"],"Under sectoral bargaining, agreements apply across an industry, so coverage can far exceed membership."),"Source: OECD")],
 ["Germany adds **codetermination**: by law, workers elect up to half the members of the supervisory boards of large companies.",
  M("What is codetermination?",["Workers electing members of company boards","Unions owning all of a company's shares outright","The state setting every wage","Managers choosing union leaders"],"Shareholders keep the tie-breaking vote, so it is a share of power, not control.")],
 ["Unions raise their members' pay and narrow gaps between workers. Critics say they can protect poor performers, raise costs and leave non-members out.",
  EX("Explain in your own words why workers bargaining together have more power than workers bargaining alone.","An employer can easily replace or ignore one worker who asks for more, so each person has to accept what is offered. If everyone bargains together and can stop work together, the employer cannot run the business without reaching a deal. That shared leverage is the whole basis of a union.")]
]},
{t:'Co-ops and public enterprise',sub:'Ownership experiments that exist right now',items:[
 ["The world's best-known worker co-op group is **Mondragon** in Spain's Basque region. Founded in 1956, it has about 70,000 workers in factories, a supermarket chain and a bank.",
  M("What is Mondragon?",["A large group of worker-owned co-ops","A Soviet planning agency in Moscow, closed in 1991","A Swedish trade union","A public utility in Seattle"],"Worker-members elect the governing council and share the profits.")],
 ["Mondragon limits pay gaps: top managers earn only several times what the lowest-paid member does. In large U.S. corporations the CEO often earns hundreds of times the typical worker's pay.",
  DATA("Top pay compared with typical worker pay",[["Mondragon co-ops (cap, roughly)",6,"about 6 to 1"],["Large U.S. firms (CEO, 2022)",272,"about 272 to 1"]],TF("The chart shows pay gaps at Mondragon are much wider than at large U.S. firms.",false,"They are far narrower. Critics note Mondragon sometimes struggles to hire top managers at that pay."),"Sources: Mondragon; AFL-CIO Executive Paywatch")],
 ["Worker co-ops have real limits. They find it hard to raise money, since outside investors get no control. Mondragon also employs many non-member workers abroad, and its biggest firm, Fagor, went bankrupt in 2013.",
  PICK("Which are real difficulties for worker co-ops?",["Raising outside investment","Deciding who becomes a member"],["Workers have no vote","Profits go to distant shareholders"],"Votes for workers and no outside shareholders are the defining features of a co-op, not its problems.")],
 ["**Public enterprise** is common worldwide. Norway's state owns two-thirds of its main oil company, and oil income goes into a public fund worth well over a trillion dollars, owned by all Norwegians.",
  CASE("A country discovers oil. Option A: sell the rights to private companies and tax them lightly. Option B: keep majority public ownership and save the income in a fund for all citizens.",M("Which option did Norway choose?",["Option B","Option A","Neither one","Both equally"],"Alaska took a smaller step the same way: its Permanent Fund pays every resident a yearly dividend from oil income.")),{g:"A trillion-dollar fund and they still eat pickled fish. Respect."}],
 ["Public ownership can also fail. Venezuela's state oil company was packed with political loyalists and starved of investment after 2003, and its output collapsed.",
  SORT("What tends to make a public enterprise succeed or fail?",{"Helps it succeed":["Professional managers","Open public accounts","Independence from daily politics"],"Makes it fail":["Jobs handed out for loyalty","Profits drained with no reinvestment"]},"Norway and Venezuela both had state oil. The difference was in how it was governed.")],
 ["Unions, co-ops and public enterprise each shift some power away from private owners. None is a magic fix, and each works better or worse depending on its design.",
  PAIR("Match the tool to how it shifts power.",[["Union","Workers bargain with the owner"],["Worker co-op","Workers become the owners"],["Public enterprise","Citizens own through government"],["Codetermination","Workers get seats on the board"]],"These tools can be combined, and in many countries they are.")]
]}]});

 raf=0;const dt=Math.min(.033,Math.max(.001,(now-last)/1000));last=now;T+=dt;

 if(LIVE.length&&!document.hidden)raf=requestAnimationFrame(frame)}

 (root||document).querySelectorAll('.mascot:not([data-on])').forEach(el=>{el.dataset.on='1';const i=new Inst(el);el._m=i;if(reduce())i.still();else{i.step(.016);LIVE.push(i)}});
 kick()}

function look(x,y){LIVE.forEach(i=>{if((i.el.dataset.pose||'')!=='think')return;const b=i.el.getBoundingClientRect();const dx=x-(b.left+b.width/2),dy=y-(b.top+b.height/2);const d=Math.max(60,Math.hypot(dx,dy));i.el.dataset.lx=clamp(dx/d*1.2,-1,1).toFixed(2);i.el.dataset.ly=clamp(dy/d*1.2,-1,1).toFixed(2)})}

function nextHeartIn(){if(st.hearts>=MAXH||!st.heartAt)return '';const ms=Math.max(0,st.heartAt+HEART_MS-Date.now());return Math.floor(ms/60000)+':'+pad(Math.floor(ms/1000)%60)}
function dayXP(){return st.days[today()]||0}
function liveStreak(){return (st.lastDay===today()||st.lastDay===addDays(today(),-1))?st.streak:0}
function addXP(n){const t=today();st.xp+=n;st.days[t]=(st.days[t]||0)+n;if(st.lastDay!==t){st.streak=st.lastDay===addDays(t,-1)?st.streak+1:1;st.lastDay=t}}
function weekXP(){const ws=weekStart();let t=0;for(let i=0;i<7;i++)t+=st.days[addDays(ws,i)]||0;return t}
function addMistake(id){if(!st.mistakes.includes(id))st.mistakes.push(id);st.srs[id]={box:0,due:today()}}
function srsRight(id){const s=st.srs[id];if(!s)return;s.box++;if(s.box>=SRS_GAP.length){delete st.srs[id];st.mistakes=st.mistakes.filter(x=>x!==id)}else s.due=addDays(today(),SRS_GAP[s.box])}

const unitDone=u=>!!st.cp[u.id];

 h+='<div class="seg"><button class="'+(LB.mode==='week'?'on':'')+'" data-a="lb-mode" data-m="week" aria-pressed="'+(LB.mode==='week')+'">This week</button><button class="'+(LB.mode==='all'?'on':'')+'" data-a="lb-mode" data-m="all" aria-pressed="'+(LB.mode==='all')+'">All time</button></div>';
 h+='<div class="card">'+rows.map((r,i)=>{const me=r.id===st.lb.id;const n=String(r.name||'Player');
  return '<div class="lbrow'+(me?' me':'')+'"><span class="rank num">'+(i+1)+'</span><span class="av">'+esc(n[0].toUpperCase())+'</span><div class="who"><b>'+esc(n)+(me?' (you)':'')+'</b><small>'+(+r.streak||0)+'-day streak · '+(+r.units||0)+((+r.units===1)?' unit done':' units done')+'</small></div><span class="pts num">'+(+r[key]||0)+'<small>XP</small></span></div>'}).join('')+'</div>';
 if(rows.length<2)h+='<p class="muted" style="font-size:15px">It\'s just you so far. Share the app link with a friend and they will show up here when they join.</p>';
 h+='<p class="muted" style="font-size:14px">'+(LB.loading?'Updating…':LB.err?esc(LB.err):'Weekly XP starts over every Monday.')+' <button class="link" data-a="lb-refresh">Refresh</button></p>';
 h+='<details><summary>Leaderboard settings</summary><div class="setrow"><span>Display name</span><input class="textin" data-in="lbname" maxlength="24" value="'+esc(st.lb.name)+'" aria-label="Display name" style="max-width:180px"></div><div class="setrow"><span>Leave the leaderboard<br><small>Removes your name and stats for everyone</small></span><button class="btn ghost sm" data-a="lb-leave">Leave</button></div></details>';
 return h+'</div>'};

/* ---------- play reminders (Web Push; settings stored in Firestore, sent by a scheduled job) ---------- */
const VAPID_PUBLIC='';
const REM_FREQ=[['off','Off'],['daily','Daily'],['every2','Every 2 days'],['weekly','Weekly']];
function remSupported(){return VAPID_PUBLIC.length>40&&lbOn()&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&window.isSecureContext}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function remURL(id){return fsBase()+'/projects/'+encodeURIComponent(LB_CFG.projectId)+'/databases/(default)/documents/reminders/'+encodeURIComponent(id)+'?key='+encodeURIComponent(LB_CFG.apiKey)}
function lastPlayedDay(){const ds=Object.keys(st.days).filter(d=>st.days[d]>0).sort();return ds.length?ds[ds.length-1]:''}
let remTimer=null,remSub=null;
function remPush(){if(!lbOn()||!st.rem.on||!remSub)return;clearTimeout(remTimer);remTimer=setTimeout(()=>{try{
 const body={endpoint:remSub.endpoint,p256dh:remSub.keys.p256dh,auth:remSub.keys.auth,freq:st.rem.freq,hour:st.rem.hour,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Los_Angeles',lastPlayed:lastPlayedDay(),updated:new Date().toISOString()};
 const mask=Object.keys(body).map(k=>'updateMask.fieldPaths='+k).join('&');
 fetch(remURL(st.rem.id)+'&'+mask,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(fsEnc(body))}).catch(()=>{})}catch(e){}},1200)}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function remKeyOk(sub){if(st.rem.key!==VAPID_PUBLIC)return false;try{const k=sub.options&&sub.options.applicationServerKey;if(!k)return true;const a=new Uint8Array(k),b=b64u(VAPID_PUBLIC);return a.length===b.length&&a.every((x,i)=>x===b[i])}catch(e){return true}}
/* Re-subscribes on its own whenever the phone's signup has gone stale: missing, expired, or made with an older key. */
async function remSubscribe(){const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
 if(sub&&(!remKeyOk(sub)||(sub.expirationTime&&sub.expirationTime<Date.now()+864e5))){try{await sub.unsubscribe()}catch(e){}sub=null}
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});st.rem.key=VAPID_PUBLIC;remSub=sub.toJSON();save();return remSub}
async function remEnable(freq){if(!remSupported())return;
 if(isIOS()&&!isStandalone()){toast('On iPhone, add Means &amp; Ends to your Home Screen first.',4000);render();return}
 let perm=Notification.permission;if(perm==='default'){try{perm=await Notification.requestPermission()}catch(e){perm='denied'}}
 if(perm!=='granted'){st.rem.on=false;st.rem.freq='off';save();toast('Notifications are blocked. Turn them on in your device settings to get reminders.',4000);render();return}
 try{await remSubscribe()}catch(e){toast('Couldn\'t turn on reminders on this device.');render();return}
 if(!st.rem.id)st.rem.id=newId();st.rem.freq=freq;st.rem.on=true;save();remPush();render();toast('Reminders on. Gus will be insufferable about it.')}
function remDisable(){st.rem.on=false;st.rem.freq='off';save();if(lbOn()&&st.rem.id){try{fetch(remURL(st.rem.id),{method:'DELETE'}).catch(()=>{})}catch(e){}}
 navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(s=>s&&s.unsubscribe()).catch(()=>{});render()}
function remInit(){if(!remSupported()||!st.rem.on)return;
 if(Notification.permission!=='granted'){st.rem.on=false;st.rem.freq='off';save();return}
 remSubscribe().then(()=>remPush()).catch(()=>{})}
function hourLabel(h){return (h%12||12)+':00 '+(h<12?'AM':'PM')}
function remRow(){
 if(!remSupported())return '<div class="setrow"><span>Play reminders<br><small>Available in the installed app at jaystone9.github.io/means-and-ends</small></span></div>';
 const iosTip=isIOS()&&!isStandalone()?'<br><small>On iPhone: tap Share, then Add to Home Screen, and open it from there.</small>':'';
 const blocked=Notification.permission==='denied'?'<br><small>Notifications are blocked for this app in your device settings.</small>':'';
 return '<div class="setrow"><span>Play reminders<br><small>From Gus, and only if you haven\'t played yet that day</small>'+iosTip+blocked+'</span><select data-in="remfreq" aria-label="Play reminders">'+REM_FREQ.map(f=>'<option value="'+f[0]+'"'+(st.rem.freq===f[0]?' selected':'')+'>'+f[1]+'</option>').join('')+'</select></div>'+
 (st.rem.on?'<div class="setrow"><span>Remind me at</span><select data-in="remhour" aria-label="Reminder time">'+[7,8,9,12,15,17,18,19,20,21].map(x=>'<option value="'+x+'"'+(st.rem.hour===x?' selected':'')+'>'+hourLabel(x)+'</option>').join('')+'</select></div>':'')}

/* ---------- actions ---------- */
function unitById(id){return UNITS.find(u=>u.id===id)}
function guideHTML(u){return '<h2>'+esc(u.title)+'</h2><p class="muted">'+esc(u.blurb)+'</p><div class="guide">'+u.lessons.map((l,i)=>'<h3>'+(i+1)+'. '+esc(l.t)+'</h3><ul>'+l.items.map(q=>'<li>'+rich(q.teach)+'</li>').join('')+'</ul>').join('')+'</div>'}
const ACT={
 tab(el){const t=el.dataset.t;if(t===tab&&t==='learn'){toCurrent(true);return}tab=t;render();if(t==='learn')toCurrent(false);else window.scrollTo(0,0);if(t==='friends')lbLoad()},
 totop(){window.scrollTo({top:0,behavior:reduce()?'auto':'smooth'})},
 go(){const n=nextNode();if(n)startNode(n.u,n.cp?n.u.lessons.length:n.li)},
 node(el){const u=unitById(el.dataset.u),i=+el.dataset.i,ns=unitNodes(u),n=ns[i],nx=nextNode();
  if(nx&&nx.u===u&&((nx.cp&&n.cp)||(!nx.cp&&!n.cp&&nx.li===n.li)))return startNode(u,i);
  if(n.done)return modal('<h2>'+esc(n.cp?u.title+' checkpoint':u.lessons[i].t)+'</h2><p class="muted">'+(n.cp?'You passed this checkpoint.':esc(u.lessons[i].sub||'')+' You finished this lesson.')+'</p><button class="btn" data-a="redo" data-u="'+u.id+'" data-i="'+i+'">'+(n.cp?'Take it again':'Practice it again')+'</button>');
  toast(unitOpen(u)?'Finish the lessons before this one first.':'Pass the checkpoint before this unit to open it.')},
 redo(el){closeModal();startNode(unitById(el.dataset.u),+el.dataset.i)},
 guide(el){modal(guideHTML(unitById(el.dataset.u)))},
 testout(el){const u=unitById(el.dataset.u);modal('<h2>Test out of '+esc(u.title)+'?</h2><p class="muted">Already know this unit? Answer its questions with no lessons first. Score 85% or better and the whole unit is marked done. It costs no hearts, and nothing happens if you miss.</p><button class="btn" data-a="testgo" data-u="'+u.id+'">Start the test</button>')},
 testgo(el){closeModal();const u=unitById(el.dataset.u);start({mode:'testout',u,hearts:false,title:'Test out',steps:cpSteps(u)})},
 tracks(){modal('<h2>Choose a level</h2>'+TRACKS.map(t=>{const us=trackUnits(t.id),d=us.filter(unitDone).length;return '<button class="trk'+(st.track===t.id?' on':'')+'" data-a="track" data-t="'+t.id+'"><div><b>'+esc(t.name)+'</b><small>'+esc(t.sub)+'</small></div><span class="chip">'+d+'/'+us.length+'</span></button>'}).join(''))},
 track(el){st.track=el.dataset.t;save();closeModal();tab='learn';lastWalk=null;render();window.scrollTo(0,0)},
 hearts(){heartsTick();const t=nextHeartIn();modal('<h2>'+st.hearts+' of '+MAXH+' hearts</h2><p class="muted">A wrong answer in a lesson or checkpoint costs one heart. Explaining in your own words and practice never do. One heart comes back every 30 minutes'+(t?' (next in '+t+')':'')+', and finishing a practice round earns one right away.</p>'+(st.hearts<MAXH?'<button class="btn" data-a="earn">Practice to earn a heart</button>':''))},
 earn(){closeModal();const had=!!S;if(had){S=null;$('#ov').classList.remove('on');document.body.style.overflow=''}const qs=learnedQs().filter(q=>q.t!=='ex');if(!qs.length){if(had)render();return toast('Finish your first lesson to unlock practice. Hearts also refill on their own.',3600)}startPractice(weakDue().length?'weak':'mix')},
 weak(){startPractice('weak')},mix(){startPractice('mix')},explain(){startPractice('explain')},
 close(){closeModal()},
 quit(){if(S&&!S.out&&!S.result&&S.i>0)return modal('<h2>Leave this '+(S.mode==='lesson'?'lesson':'round')+'?</h2><p class="muted">Your progress in it will not be saved.</p><button class="btn bad" data-a="quit2">Leave</button><button class="btn ghost" data-a="close">Keep going</button>');closeOv()},
 quit2(){closeModal();closeOv()},
 done(){closeOv();if(tab==='learn')setTimeout(()=>toCurrent(true),60)},
 next(){next()},check(){check()},
 sel(el){S.V.sel=+el.dataset.k;renderS(true)},
 tf(el){S.V.sel=el.dataset.v==='1';renderS(true)},
 pick(el){const k=el.dataset.k;S.V.sel[k]=!S.V.sel[k];renderS(true)},
 pl(el){const i=+el.dataset.i;if(S.V.link[i]!=null){delete S.V.link[i];S.V.selL=-1}else S.V.selL=S.V.selL===i?-1:i;renderS(true)},
 pr(el){const i=+el.dataset.i,V=S.V;const owner=Object.keys(V.link).find(l=>V.link[l]===i);if(owner!=null){delete V.link[owner];if(V.selL<0){renderS(true);return}}if(V.selL>=0){V.link[V.selL]=i;V.selL=-1}renderS(true)},
 si(el){const k=+el.dataset.k;S.V.sel=S.V.sel===k?-1:k;renderS(true)},
 sb(el){if(S.V.sel<0)return;S.V.place[S.V.sel]=+el.dataset.g;S.V.sel=-1;renderS(true)},
 su(el){delete S.V.place[+el.dataset.k];renderS(true)},
 ord(el){const i=+el.dataset.i,p=S.V.pick,n=p.indexOf(i);if(n>=0)p.splice(n,1);else p.push(i);renderS(true)},
 show(){S.V.shown=true;renderS(true);const b=$('#sbody');if(b)b.scrollTop=b.scrollHeight},
 rate(el){const r=+el.dataset.r,q=S.steps[S.i].q;S.rate=r;S.asked++;if(r===2){S.right++;S.first++;srsRight(q.id)}else if(r===0)addMistake(q.id);S.res=true;S.phase='fb';save();renderS(true);if(r===2)confetti(30)},
 'ob-next'(){obStep++;render();window.scrollTo(0,0)},
 'ob-track'(el){st.track=el.dataset.t;render()},
 'ob-goal'(el){st.goal=+el.dataset.g;render()},
 'ob-done'(){st.ob=true;save();render();window.scrollTo(0,0)},
 reset(){modal('<h2>Erase all progress?</h2><p class="muted">Your XP, streak and finished lessons on this device will be gone for good.</p><button class="btn bad" data-a="reset2">Erase everything</button><button class="btn ghost" data-a="close">Keep my progress</button>')},
 reset2(){const lb=st.lb,rem=st.rem;st=fresh();st.lb=lb;st.rem=rem;obStep=0;save();closeModal();tab='learn';render();window.scrollTo(0,0)},
 'lb-join'(){const n=($('#lbName').value||'').trim().slice(0,24);if(!n)return toast('Type a display name first.');st.lb.name=n;if(!st.name)st.name=n;if(!st.lb.id)st.lb.id=newId();st.lb.joined=true;save();LB.at=0;render();lbLoad()},
 'lb-mode'(el){LB.mode=el.dataset.m;render()},
 'lb-refresh'(){LB.at=0;lbLoad();render()},
 'lb-leave'(){modal('<h2>Leave the leaderboard?</h2><p class="muted">Your name and stats will be removed for everyone. Your progress on this device stays.</p><button class="btn bad" data-a="lb-leave2">Leave</button><button class="btn ghost" data-a="close">Stay</button>')},
 'lb-leave2'(){if(lbOn()&&st.lb.id){try{fetch(lbURL(st.lb.id),{method:'DELETE'}).catch(()=>{})}catch(e){}}st.lb.joined=false;save();closeModal();LB.rows=null;render()}
};
document.addEventListener('click',e=>{const m=e.target.closest('[data-tap]');if(m&&!e.target.closest('[data-a]')){Mascots.poke(m);const w=m.dataset.tap,ctx=m.dataset.ctx;const pool=LINES[w][ctx]&&Math.random()<.4?ctx:'poke';toast('<span style="display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75">'+label(w)+'</span>'+esc(say(w,pool)),3400);return}
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a],[data-tap]')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'&&$('.modal'))closeModal();
 if(e.key==='Enter'&&S&&!e.target.matches('textarea,button,input,select')){const b=$('#sroot [data-a=next],#sroot [data-a=check]:not([disabled]),#sroot [data-a=done]');if(b)b.click()}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
 if(k==='ex'){S.V.text=v;return}
 if(k==='name'){st.name=v.trim().slice(0,24);save()}
 else if(k==='lbname'){const n=v.trim().slice(0,24);if(n){st.lb.name=n;save()}}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
 if(k==='goal'){st.goal=+v;save();render()}
 else if(k==='theme'){st.theme=v;save();applyTheme()}
 else if(k==='remfreq'){if(v==='off')remDisable();else remEnable(v)}
 else if(k==='remhour'){st.rem.hour=+v;save()}});
document.addEventListener('pointermove',e=>Mascots.look(e.clientX,e.clientY),{passive:true});
document.addEventListener('pointerdown',e=>Mascots.look(e.clientX,e.clientY),{passive:true});
window.addEventListener('scroll',onScroll,{passive:true});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
setInterval(()=>{if(!st)return;const h=st.hearts;heartsTick();const c=$('#hclock');if(c)c.textContent=nextHeartIn()||'0:00';if(st.hearts!==h){save();if(S&&S.out&&!S.failed){closeOv()}else if(!S)render()}},1000);

/* ---------- new version check: reloads on open, never in the middle of a lesson ---------- */
let wantReload=false;
function pendingReload(){if(wantReload&&!S){wantReload=false;location.reload()}}
function versionCheck(){if(!window.ME_BUILD||!window.fetch||location.protocol==='file:')return;fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=(t||'').trim();if(t&&/^\d+$/.test(t)&&t!==window.ME_BUILD){if(sessionStorage.getItem('me.reloaded')===t)return;try{sessionStorage.setItem('me.reloaded',t)}catch(e){}wantReload=true;pendingReload()}}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){versionCheck();heartsTick();if(!S&&st&&st.ob)render()}});
window.addEventListener('pageshow',versionCheck);

/* ---------- boot ---------- */
load();applyTheme();heartsTick();
document.body.insertAdjacentHTML('afterbegin',SCDEFS);
render();save();remInit();versionCheck();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
